<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Tribeca · Latín II</title>
<style>
:root{
  --ink:#211814; --ink-soft:#51443c; --paper:#f3ead8; --paper-hi:#fffaf0;
  --wine:#6f2f32; --wine2:#8a4142; --bronze:#b88b4d; --bronze2:#d1ad72;
  --black:#15120f; --black2:#211b17; --muted:#8e7d6f; --green:#335b4c;
  --line:rgba(117,82,52,.24); --shadow:0 34px 90px rgba(31,19,13,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#1a1512}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;background:#1a1512}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.28}
.scene{position:fixed;inset:-2.5%;z-index:0;pointer-events:none;overflow:hidden;background:#241712}
.scene:before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(90deg,rgba(15,11,9,.62) 0%,rgba(15,11,9,.18) 23%,rgba(17,12,9,.12) 52%,rgba(15,11,9,.46) 100%),
    linear-gradient(180deg,rgba(16,11,8,.14),rgba(16,11,8,.32)),
    url("https://upload.wikimedia.org/wikipedia/commons/c/c3/Single_continuous_fresco_from_the_House_of_the_Golden_Bracelet%2C_Pompeii.jpg");
  background-size:cover;background-position:center 44%;filter:saturate(1.08) contrast(1.05) brightness(.93);
  transform:scale(1.055) translate3d(var(--bgx,0px),var(--bgy,0px),0);
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
  animation:slowScene 30s ease-in-out infinite alternate;
}
.scene:after{content:"";position:absolute;inset:0;background:radial-gradient(900px 620px at 56% 42%,rgba(255,238,202,.10),transparent 68%),linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.26));mix-blend-mode:soft-light}
@keyframes slowScene{from{background-position:48% 44%}to{background-position:54% 47%}}
.app{position:relative;z-index:1;min-height:100vh}
.masthead{height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:0 clamp(18px,4vw,64px);color:#fff5e6;border-bottom:1px solid rgba(221,189,133,.28);background:linear-gradient(180deg,rgba(18,13,10,.68),rgba(18,13,10,.30));backdrop-filter:blur(10px);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-emblem{width:42px;height:42px;display:grid;place-items:center;position:relative;color:#ead0a2;font:700 17px Georgia,serif}
.brand-emblem:before,.brand-emblem:after{content:"";position:absolute;inset:3px;border:1px solid rgba(217,178,111,.55);transform:rotate(45deg)}
.brand-emblem:after{inset:8px;border-color:rgba(217,178,111,.22)}
.brand-copy strong{display:block;font:600 18px/1.05 Georgia,serif;letter-spacing:.035em}
.brand-copy span{display:block;color:#cdbda9;font-size:10px;letter-spacing:.17em;text-transform:uppercase;margin-top:4px}
.mode-switch{justify-self:center;display:flex;align-items:center;gap:26px;height:100%;position:relative}
.practice-tab{appearance:none;border:0;background:transparent;color:#d2c3b2;padding:29px 2px 25px;font-weight:700;letter-spacing:.04em;position:relative}
.practice-tab:after{content:"";position:absolute;height:2px;left:50%;right:50%;bottom:16px;background:var(--bronze2);transition:.22s ease}
.practice-tab.active{color:#fff8ec}
.practice-tab.active:after{left:0;right:0}
.mast-note{justify-self:end;color:#d5c5b2;font-size:12px;display:flex;align-items:center;gap:8px}
.mast-note svg{width:18px;height:18px;stroke:#d2ad73;fill:none;stroke-width:1.5}
.workspace{width:min(1540px,calc(100% - 42px));margin:34px auto 56px;display:grid;grid-template-columns:minmax(0,1.48fr) minmax(360px,.72fr);gap:24px;align-items:start}
.translation-desk{position:relative;background:linear-gradient(180deg,rgba(255,250,239,.985),rgba(242,230,208,.985));box-shadow:var(--shadow);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);min-height:680px}
.translation-desk:before{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(118,80,50,.32);clip-path:inherit}
.translation-desk:after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--wine) 0 14px,var(--bronze) 14px 20px,transparent 20px 27px,var(--bronze) 27px 33px,var(--wine) 33px 47px)}
.work{padding:clamp(30px,4vw,58px) clamp(28px,5vw,72px) 46px;position:relative}
.translation-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid rgba(110,74,47,.22)}
.section-kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--wine);font-weight:850}
.translation-title{font:600 clamp(24px,2.5vw,34px)/1.1 Georgia,serif;margin:4px 0 0}
.source{font:italic 13px/1.35 Georgia,serif;color:#7f6957;text-align:right;max-width:50%}
.latin-stage{position:relative;min-height:245px;display:grid;grid-template-columns:54px minmax(0,1fr) 54px;align-items:center;margin:0 -18px 24px}
.latin{font:500 clamp(36px,4.2vw,58px)/1.28 Georgia,"Times New Roman",serif;text-align:center;letter-spacing:.005em;padding:26px 10px;color:#241913;text-wrap:balance}
.latin.text-mode{font-size:clamp(25px,2.55vw,36px);line-height:1.55;text-align:left;text-wrap:pretty}
.latin.swap{animation:inkIn .32s ease both}
@keyframes inkIn{from{opacity:.12;filter:blur(7px);transform:translateY(5px)}to{opacity:1;filter:blur(0);transform:none}}
.token{font:inherit;color:inherit;border:0;border-bottom:1px solid transparent;background:transparent;padding:0 2px;transition:.14s ease}
.token:hover,.token:focus{outline:none;color:var(--wine);border-bottom-color:rgba(111,47,50,.45);text-shadow:0 0 0 transparent}
.nav-arrow{width:44px;height:62px;border:0;background:transparent;color:#7f6047;font:300 34px/1 Georgia,serif;transition:.16s ease}
.nav-arrow:not(:disabled):hover{color:var(--wine);transform:scale(1.08)}
.writing-label{display:flex;align-items:center;gap:10px;color:#715c4c;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
.writing-label:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(113,92,76,.35),transparent)}
textarea{width:100%;min-height:158px;resize:vertical;border:0;border-top:1px solid rgba(105,72,47,.27);border-bottom:1px solid rgba(105,72,47,.27);border-radius:0;background:rgba(255,253,247,.55);padding:18px 2px;color:#2a201b;outline:none;font:17px/1.7 Georgia,serif;box-shadow:inset 0 14px 28px rgba(100,70,45,.035)}
textarea:focus{border-color:rgba(111,47,50,.62);background:rgba(255,253,247,.78)}
.translation-actions-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.primary-btn{border:0;border-radius:0;background:var(--wine);color:#fff7e8;padding:13px 24px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 10px 24px rgba(111,47,50,.22);transition:.16s ease}
.primary-btn:hover{background:var(--wine2);transform:translateY(-1px)}
.tool-row{display:flex;gap:18px;flex-wrap:wrap}
.tool-btn{border:0;border-bottom:1px solid rgba(108,74,49,.34);background:transparent;color:#5e4a3c;padding:7px 0 5px;font-weight:700;transition:.14s ease}
.tool-btn:hover{color:var(--wine);border-bottom-color:var(--wine)}
.btn{font:inherit;cursor:pointer}.btn.secondary{border:1px solid rgba(203,163,101,.35);border-radius:0;background:transparent;color:#e8d4b3;padding:7px 9px;box-shadow:none}
.notice,.feedback{margin-top:16px;padding:14px 16px;border-left:3px solid var(--bronze);background:rgba(231,211,179,.40);color:#56473d}
.feedback{display:none}.feedback.show{display:block}.feedback.good{border-left-color:#557d67;background:rgba(210,228,216,.65)}.feedback.bad{border-left-color:#9c5652;background:rgba(241,215,210,.72)}.feedback.warn{border-left-color:#b88b4d;background:rgba(241,225,193,.68)}
.feedback strong{display:block;margin-bottom:3px}
.checklist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
.checklist li{font-size:12px;padding:5px 8px;border:1px solid rgba(110,75,50,.18);background:rgba(255,252,244,.55)}
.ok{color:#355b4e}.miss{color:#873f3f}
.analysis{display:none;margin-top:22px}.analysis.show{display:block;animation:reveal .22s ease}@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.analysis h3{font:600 22px Georgia,serif;margin:0 0 10px}.analysis-row{display:grid;grid-template-columns:140px 1fr 1.25fr;gap:14px;padding:11px 0;border-bottom:1px solid rgba(110,75,50,.18);font-size:13px}.analysis-row b{font:600 16px Georgia,serif}.muted{color:#806e60}
.lexicon-dock{position:sticky;top:108px;max-height:calc(100vh - 132px);overflow:hidden;background:linear-gradient(180deg,rgba(20,17,14,.965),rgba(31,24,20,.975));color:#f2e5d2;box-shadow:0 30px 80px rgba(20,12,8,.34);border:1px solid rgba(214,175,110,.28);min-height:680px}
.lexicon-dock:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(184,139,77,.06),transparent 35%),radial-gradient(circle at 90% 10%,rgba(184,139,77,.08),transparent 28%)}
.lexicon-head{position:relative;padding:24px 24px 18px;border-bottom:1px solid rgba(214,175,110,.20)}
.lexicon-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lexicon-title h2{font:600 25px Georgia,serif;margin:0;color:#fff4df}
.lexicon-monogram{width:38px;height:38px;border:1px solid rgba(214,175,110,.44);display:grid;place-items:center;color:#d5ae72;font:600 15px Georgia,serif;transform:rotate(45deg)}
.lexicon-monogram span{transform:rotate(-45deg)}
.tabs{display:flex;gap:18px;margin-top:17px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;border-bottom:1px solid transparent;background:transparent;color:#bfae9b;padding:0 0 7px;font-size:12px;font-weight:750;white-space:nowrap}
.tab.active{color:#f4dfbd;border-bottom-color:#c89b58}
.dict-side{position:relative;padding:0 24px 15px}
#dictSearchPanel{margin-top:14px!important}
.search-wrap{position:relative}
#dictSearch{width:100%;border:0;border-bottom:1px solid rgba(219,186,131,.34);border-radius:0;background:transparent;color:#f7ecda;padding:11px 0 11px 26px;outline:none}
#dictSearch::placeholder{color:#86796b}
.search-icon{position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#bf9960;fill:none;stroke-width:1.7}
.alpha{display:flex!important;gap:4px!important;overflow-x:auto;padding:10px 0 3px;margin-top:3px!important;scrollbar-width:none}
.alpha button{flex:0 0 26px!important;width:26px;height:26px;border:0!important;border-radius:0!important;background:transparent!important;color:#8f8070!important;padding:0!important;font:600 11px Georgia,serif!important}
.alpha button.active{color:#f3d5a1!important;border-bottom:1px solid #c69a59!important}
#dictNote{display:none}
.dict-main{position:relative;padding:0 24px 20px}
.dict-main>.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:11px 0 10px;border-bottom:1px solid rgba(214,175,110,.18);margin-bottom:0}
.dict-main>.toolbar h3{font:600 16px Georgia,serif;color:#efe1cd;margin:0}
.dict-metrics{display:none}
#dictRightControls .secondary{font-size:11px;padding:0;color:#a99278;border:0;background:transparent;box-shadow:none}
.dict-list{height:430px;overflow:auto;padding:4px 8px 0 0;scrollbar-width:thin;scrollbar-color:#765839 transparent}
.entry{position:relative;padding:15px 72px 15px 0;border-bottom:1px solid rgba(210,177,121,.13);background:transparent!important;border-radius:0!important}
.entry:hover{background:linear-gradient(90deg,rgba(190,139,72,.07),transparent)!important}
.entry h4{font:600 21px/1.1 Georgia,serif;color:#fff1db;margin:0 0 7px;padding:0!important}
.entry .raw{font-size:13px;line-height:1.55;color:#d9cbbb}.entry .meta{display:none}.entry mark{background:#8c6435;color:#fff0d5;padding:0 2px}.entry .scan{position:absolute;right:0;top:15px;border:0;border-bottom:1px solid rgba(206,163,101,.32);border-radius:0;background:transparent;color:#b99869;padding:2px 0;font-size:10px;font-weight:700}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;color:#948675;font-size:11px}
.pager .secondary{border:0;background:transparent;color:#c2aa89;padding:4px 0;box-shadow:none}
.empty{padding:18px 0;color:#9c8c7b}
.pdf-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0}.pdf-tools input{background:#fff;color:#2c211b;border:0;padding:7px}.pdf-tools .secondary{border:1px solid rgba(203,163,101,.35)!important;padding:7px 9px!important;color:#e8d4b3!important}.pdf-frame{height:470px;background:#eadcc6;overflow:hidden}.pdf-frame object,.pdf-frame iframe{width:100%;height:100%;border:0}
.popover{display:none;position:fixed;z-index:90;width:min(390px,calc(100vw - 24px));background:#1d1814;color:#f2e6d6;border:1px solid rgba(214,175,110,.32);box-shadow:0 24px 70px rgba(18,10,6,.36);padding:18px 18px 16px}.popover.show{display:block;animation:reveal .18s ease}.popover .close{position:absolute;right:9px;top:7px;border:0;background:transparent;color:#bda78a;font-size:20px}.popover .lemma{font:600 23px Georgia,serif;color:#fff2dc;margin-bottom:5px}.popover .meta{color:#b9aa98;font-size:12px}.popover .meaning{margin-top:8px;font-weight:750;color:#e6cfaa}.popover .actions{margin-top:12px}.popover .secondary{border:0;border-bottom:1px solid #a57a45;border-radius:0;background:transparent;color:#d9b87d;padding:5px 0;box-shadow:none}
.compat{display:none!important}.entry .scan{display:none!important}
@media(max-width:1120px){.workspace{grid-template-columns:1fr;width:min(100% - 24px,980px)}.lexicon-dock{position:relative;top:auto;max-height:none;min-height:0}.dict-list{height:min(470px,58vh)}.mast-note{display:none}.masthead{grid-template-columns:1fr auto}.mode-switch{justify-self:end}.brand-copy span{display:none}}
@media(max-width:720px){.masthead{height:auto;min-height:72px;padding:10px 14px;grid-template-columns:1fr}.mode-switch{justify-self:stretch;justify-content:center;border-top:1px solid rgba(216,177,111,.18);margin:6px -14px -10px;padding:0 14px}.practice-tab{padding:14px 4px 15px}.practice-tab:after{bottom:8px}.workspace{margin:18px auto 34px;width:calc(100% - 14px);gap:14px}.translation-desk{clip-path:none;min-height:0}.translation-desk:before{clip-path:none}.work{padding:28px 18px 28px}.translation-header{display:block}.source{text-align:left;max-width:100%;margin-top:8px}.latin-stage{grid-template-columns:36px minmax(0,1fr) 36px;min-height:190px;margin:0 -8px 18px}.latin{font-size:clamp(29px,9vw,42px);padding:18px 5px}.latin.text-mode{font-size:24px}.nav-arrow{width:34px}.translation-actions-row{align-items:flex-start}.tool-row{gap:14px}.analysis-row{grid-template-columns:1fr}.lexicon-dock{border-left:0;border-right:0}.dict-list{height:430px}.masthead{position:relative}.brand-emblem{width:36px;height:36px}.brand-copy strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<body>
<div class="scene" id="scene" aria-hidden="true"></div>
<div class="app">
  <header class="masthead">
    <div class="brand">
      <div class="brand-emblem">II</div>
      <div class="brand-copy"><strong>Latín II</strong><span>Tribeca · Laboratorio de traducción</span></div>
    </div>
    <div class="mode-switch" id="practiceSwitch" role="tablist" aria-label="Tipo de práctica">
      <button class="practice-tab active" data-practice="sentences" role="tab" aria-selected="true">Oraciones</button>
      <button class="practice-tab" data-practice="texts" role="tab" aria-selected="false">Textos</button>
    </div>
    <div class="mast-note">
      <svg viewBox="0 0 24 24"><path d="M3.5 12h17M12 3.5v17"/><circle cx="12" cy="12" r="8"/></svg>
      Pulsa una palabra latina para analizarla
    </div>
  </header>

  <main class="workspace">
    <section class="translation-desk view active" id="view-translate">
      <div class="work">
        <div class="translation-header">
          <div><div class="section-kicker">Exercitatio</div><h1 class="translation-title">Traducción al español</h1></div>
          <div class="source" id="translationSource"></div>
        </div>

        <div class="latin-stage">
          <button class="nav-arrow" id="prevTranslation" type="button" aria-label="Anterior">‹</button>
          <div class="latin" id="latinText"></div>
          <button class="nav-arrow" id="nextTranslation" type="button" aria-label="Siguiente">›</button>
        </div>

        <label class="writing-label" for="translationInput">Tu traducción</label>
        <textarea id="translationInput" placeholder="Escribe aquí una traducción natural y precisa…"></textarea>

        <div class="translation-actions-row">
          <button class="primary-btn" id="checkTranslation">Corregir</button>
          <div class="tool-row">
            <button class="tool-btn" id="showHint">Pista</button>
            <button class="tool-btn" id="showAnalysisBtn">Análisis</button>
            <button class="tool-btn" id="showModel">Modelo</button>
          </div>
        </div>

        <div class="notice" id="hintBox" style="display:none"></div>
        <div class="feedback" id="translationFeedback"></div>
        <ul class="checklist" id="semanticChecklist"></ul>
        <div class="analysis" id="analysisBox"></div>
      </div>
    </section>

    <aside class="lexicon-dock" id="lexiconDock" aria-label="Léxico de apoyo integrado">
      <div class="lexicon-head">
        <div class="lexicon-title"><h2>Léxico de apoyo</h2><div class="lexicon-monogram"><span>V</span></div></div>
        <div class="tabs" id="dictTabs">
          <button class="tab active" data-tab="latin">Latín → español</button>
          <button class="tab" data-tab="spanish">Español → latín</button>
          <a class="tab" target="_blank" rel="noopener noreferrer" href="https://logeion.uchicago.edu/">Diccionario externo ↗</a>
        </div>
      </div>
      <div class="dict-side">
        <div id="dictSearchPanel">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.3"/><path d="m15.2 15.2 5 5"/></svg>
            <input type="search" id="dictSearch" placeholder="Buscar lema o significado…">
          </div>
          <div class="alpha" id="alphabet"></div>
        </div>
        <div class="notice" id="dictNote"></div>
      </div>
      <div class="dict-main">
        <div class="toolbar">
          <div><h3 id="dictTitle">Latín → español</h3><div class="dict-metrics"><span id="dictMetric"></span><span id="dictModeMetric"></span></div></div>
          <div id="dictRightControls"><button class="tool-btn" id="clearDict">Limpiar</button></div>
        </div>
        <div class="dict-list" id="dictList"></div>
        <div class="pager" id="dictPager">
          <button class="tool-btn" id="dictPrev">‹ Anterior</button>
          <span id="dictPageInfo"></span>
          <button class="tool-btn" id="dictNext">Siguiente ›</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<div class="popover" id="wordPopover">
  <button class="close" id="closePopover" type="button">×</button>
  <div class="lemma" id="popLemma"></div>
  <div class="meta" id="popMeta"></div>
  <div class="meaning" id="popMeaning"></div>
  <div class="meta" id="popExtra" style="margin-top:7px"></div>
  <div class="actions"><button class="tool-btn secondary" id="popOpenDict">Consultar palabra</button></div>
</div>

<!-- Elementos de compatibilidad del motor no visibles en esta versión -->
<div class="compat" aria-hidden="true"><nav id="sideNav"></nav><nav id="mobileNav"></nav>
  <span id="homeBank"></span><span id="homeTextCount"></span>
  <select id="trainerType"><option value="mixed">Mixto</option></select>
  <button id="newRound"></button><div id="roundBar"></div><div id="challengeMeta"></div><div id="challengePrompt"></div><div id="challengeBody"></div><div id="trainerFeedback"></div><button id="nextChallenge"></button>
</div>

<script>
'use strict';
const VOX=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const strip=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/æ/g,'ae').replace(/œ/g,'oe');
const normHead=s=>strip(s).replace(/[^a-z0-9]+/g,'');
const normText=s=>strip(s).replace(/[^a-z0-9áéíóúñü ]+/g,' ').replace(/\s+/g,' ').trim();
let prepared=false;function prepareVox(){if(prepared)return;for(const e of VOX){e._h=normHead(e.head);e._r=normText(e.raw)}prepared=true}
let DICT_TOTAL=0;

/* ---------- navegación ---------- */
function showView(name){name='translate';$$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-translate'));renderTranslation();renderDictionary();window.scrollTo({top:0,behavior:'smooth'})}
$$('#sideNav button,#mobileNav button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));$$('[data-go]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.go)));


/* ---------- registro interno desactivado en V6 ---------- */
function record(){ /* Sin módulo de progreso en esta versión. */ }

/* ---------- banco didáctico controlado ---------- */

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function buildBank(){let a=[];for(const v of VERBS){for(const s of SUBJ){if(!v.grp.some(g=>s.grp.includes(g)))continue;for(const ok of v.objs){const o=OBJ[ok];for(const [tense,f] of Object.entries(v.forms)){for(const adv of ADVS){if(adv[0]==='celeriter'&&['amo, -as, -are, -avi, -atum','timeo, -es, -ere, timui'].includes(v.lemma))continue;const vf=s.num==='sg'?f[0]:f[1],ve=s.num==='sg'?f[2]:f[3];const latin=[s.la,o[0],adv[0],vf].filter(Boolean).join(' ')+'.';const spanish=[s.es,ve,o[1],adv[1]].filter(Boolean).join(' ')+'.';const morph=(s.num==='sg'?'3.ª singular':'3.ª plural')+' · '+(tense==='pres'?'presente':tense==='perf'?'perfecto':'imperfecto')+' de indicativo activo';a.push({id:'d-'+hash(latin),corpus:'didactic',label:'Oración didáctica',latin,model:spanish,cores:[[s.es.replace(/^(El|La|Los|Las) /,'').toLowerCase()],[ve],[o[1].replace(/^(el|la|los|las|al|a los) /,'')]],hint:'Localiza el verbo, comprueba su número y busca después el nominativo que concuerda con él.',syntax:'Oración transitiva simple.',tokens:[s.tok,[o[0],o[2],'sustantivo',o[3],o[1]],...(adv[0]?[[adv[0],adv[0],'adverbio','invariable',adv[1]]]:[]),[vf,v.lemma,'verbo',morph,ve]]});}}}}}
a.sort((x,y)=>hash(x.latin+'x')-hash(y.latin+'x'));const seen=new Set(),out=[];for(const x of a){if(seen.has(x.latin))continue;seen.add(x.latin);out.push(x);if(out.length===1000)break}return out}

const OFFICIAL_TEXTS=[{"id":"ciug-eut-1-2","author":"Eutropio","ref":"1, 2","latin":"Condita civitate, quam ex nomine suo Romam vocavit, haec fere egit. Multitudinem finitimorum in civitatem recepit, centum ex senioribus legit, quorum consilio omnia ageret, quos senatores nominavit propter senectutem. Tum, cum uxores ipse et populus suus non haberent, invitavit ad spectaculum ludorum vicinas urbi Romae nationes atque earum virgines rapuit.","model":"Fundada la ciudad, a la que llamó Roma por su propio nombre, hizo aproximadamente lo siguiente. Recibió en la ciudad a una multitud de pueblos vecinos, eligió a cien de los mayores, por cuyo consejo gobernaría todos los asuntos, y los llamó senadores por su vejez. Entonces, como ni él ni su pueblo tenían esposas, invitó al espectáculo de los juegos a los pueblos vecinos de Roma y raptó a sus doncellas.","cores":[["fundada","fundó"],["roma"],["pueblos vecinos","vecinos"],["cien"],["senadores"],["esposas"],["juegos"],["raptó","rapto"]],"hint":"Divide el pasaje por verbos y reconoce primero el ablativo absoluto inicial, las relativas y la subordinada con cum.","syntax":"Ablativo absoluto; relativas; subordinada con cum; coordinación de principales.","official":true},{"id":"ciug-eut-1-3","author":"Eutropio","ref":"1, 3","latin":"Postea Numa Pompilius rex creatus est, qui bellum quidem nullum gessit, sed non minus civitati quam Romulus profuit. Nam et leges Romanis moresque constituit, qui consuetudine proeliorum iam latrones ac semibarbari putabantur, et annum descripsit in decem menses prius sine aliqua supputatione confusum, et infinita Romae sacra ac templa constituit. Morbo decessit quadragesimo et tertio imperii anno.","model":"Después fue nombrado rey Numa Pompilio, que no emprendió guerra alguna, pero fue para la ciudad no menos útil que Rómulo. Estableció para los romanos leyes y costumbres, pues por la costumbre de las guerras ya eran considerados bandidos y semibárbaros; dividió el año, antes confuso sin cálculo alguno, en diez meses, y estableció en Roma innumerables ritos y templos. Murió de enfermedad en el cuadragésimo tercer año de su reinado.","cores":[["numa pompilio"],["rey"],["guerra"],["leyes"],["costumbres"],["diez meses"],["templos"],["murió","murio","falleció","fallecio"]],"hint":"Identifica creatus est como perfecto pasivo y observa las coordinaciones introducidas por et.","syntax":"Principal pasiva; relativa; coordinación múltiple; complemento temporal final.","official":true},{"id":"ciug-eut-1-4","author":"Eutropio","ref":"1, 4","latin":"Huic successit Tullus Hostilius. Hic bella reparavit, Albanos vicit, qui ab urbe Roma duodecimo miliario sunt, Veientes et Fidenates, quorum alii sexto miliario absunt ab urbe Roma, alii octavo decimo, bello superavit, urbem ampliavit adiecto Caelio monte. Cum triginta et duos annos regnasset, fulmine ictus cum domo sua arsit.","model":"A este le sucedió Tulo Hostilio. Reanudó las guerras, venció a los albanos, que están a doce millas de Roma, y derrotó en guerra a los veyentes y fidenates, de los cuales unos distan seis millas de Roma y otros dieciocho. Amplió la ciudad añadiendo el monte Celio. Después de haber reinado treinta y dos años, alcanzado por un rayo, ardió junto con su casa.","cores":[["tulo hostilio"],["guerras"],["albanos"],["veyentes","veientes"],["fidenates"],["monte celio"],["rayo"],["ardió","ardio"]],"hint":"Separa las relativas de qui y quorum; adiecto Caelio monte es ablativo absoluto.","syntax":"Principales coordinadas; relativas; ablativo absoluto; cum temporal.","official":true},{"id":"ciug-eut-1-5","author":"Eutropio","ref":"1, 5","latin":"Post hunc Ancus Marcius, Numae ex filia nepos, suscepit imperium. Contra Latinos dimicavit, Aventinum montem civitati adiecit et Ianiculum. Apud ostium Tiberis civitatem supra mare sexto decimo miliario ab urbe Roma condidit. Vicesimo et quarto anno imperii morbo periit.","model":"Después de él asumió el poder Anco Marcio, nieto de Numa por parte de su hija. Luchó contra los latinos, añadió a la ciudad el monte Aventino y el Janículo. Fundó una ciudad junto a la desembocadura del Tíber, cerca del mar, a dieciséis millas de Roma. Murió de enfermedad en el vigésimo cuarto año de su reinado.","cores":[["anco marcio"],["latinos"],["aventino"],["janículo","janiculo"],["tíber","tiber"],["fundó","fundo"],["murió","murio"]],"hint":"Numae ex filia nepos es una aposición a Ancus Marcius.","syntax":"Aposición; principales coordinadas; complementos de lugar y tiempo.","official":true},{"id":"ciug-eut-1-6","author":"Eutropio","ref":"1, 6","latin":"Deinde regnum Priscus Tarquinius accepit. Hic numerum senatorum duplicavit, circum Romae aedificavit, ludos Romanos instituit, qui ad nostram memoriam permanent. Vicit idem etiam Sabinos et non parum agrorum sublatum eisdem urbis Romae territorio iunxit, primusque triumphans urbem intravit. Muros fecit et cloacas, Capitolium inchoavit. Tricesimo octavo imperii anno per Anci filios occisus est, regis eius, cui ipse successerat.","model":"Después recibió el reino Tarquinio Prisco. Duplicó el número de senadores, construyó un circo en Roma e instituyó los juegos romanos, que perduran hasta nuestro tiempo. Venció también a los sabinos y añadió al territorio de Roma no poca tierra tomada a estos; fue además el primero que entró triunfante en la ciudad. Construyó murallas y cloacas e inició el Capitolio. En el trigésimo octavo año de su reinado fue asesinado por los hijos de Anco, aquel rey al que él mismo había sucedido.","cores":[["tarquinio prisco"],["senadores"],["juegos romanos"],["sabinos"],["territorio"],["murallas"],["capitolio"],["asesinado"]],"hint":"Hay varias principales consecutivas; identifica las relativas qui y cui.","syntax":"Coordinación de principales; relativas; participio concertado; pasiva final.","official":true},{"id":"ciug-eut-1-7","author":"Eutropio","ref":"1, 7","latin":"Post hunc Servius Tullius suscepit imperium, genitus ex nobili femina, captiva tamen et ancilla. Hic quoque Sabinos subegit, montes tres, Quirinalem, Viminalem, Esquilinum, urbi adiunxit, fossas circum murum duxit. Primus omnium censum ordinavit, qui adhuc per orbem terrarum incognitus erat. Occisus est scelere generi sui Tarquinii Superbi, filii eius regis, cui ipse successerat, et filiae, quam Tarquinius habebat uxorem.","model":"Después de él asumió el poder Servio Tulio, nacido de una mujer noble, aunque cautiva y esclava. También sometió a los sabinos, añadió a la ciudad tres montes —Quirinal, Viminal y Esquilino— y trazó fosos alrededor de la muralla. Fue el primero de todos en organizar el censo, que hasta entonces era desconocido en todo el mundo. Fue asesinado por el crimen de su yerno Tarquinio el Soberbio, hijo del rey al que él había sucedido, y de su hija, a la que Tarquinio tenía por esposa.","cores":[["servio tulio"],["sabinos"],["quirinal"],["viminal"],["esquilino"],["censo"],["asesinado"],["tarquinio"]],"hint":"genitus es participio referido a Servius Tullius; identifica las dos relativas del final.","syntax":"Participio concertado; enumeración; relativa; pasiva; genitivos encadenados.","official":true},{"id":"ciug-eut-2-5","author":"Eutropio","ref":"2, 5","latin":"T. Quintius dictator adversus Gallos, qui ad Italiam venerant, missus est. Hi ab urbe quarto miliario trans Anienem fluvium consederant. Ibi nobilissimus de senatoribus iuvenis L. Manlius provocantem Gallum ad singulare certamen progressus occidit, et sublato torque aureo colloque suo inposito in perpetuum Torquati et sibi et posteris cognomen accepit.","model":"Tito Quincio fue enviado como dictador contra los galos, que habían llegado a Italia. Estos se habían establecido a cuatro millas de la ciudad, al otro lado del río Anio. Allí Lucio Manlio, un joven de los más nobles del Senado, avanzó contra un galo que lo desafiaba a combate singular y lo mató; después de quitarle el collar de oro y ponérselo al cuello, recibió para siempre el sobrenombre de Torcuato para sí y para sus descendientes.","cores":[["tito quincio"],["galos"],["italia"],["anio"],["lucio manlio"],["combate singular"],["mató","mato"],["torcuato"]],"hint":"missus est es pasiva; provocantem Gallum es acusativo con participio; hay dos ablativos absolutos finales.","syntax":"Pasiva; relativa; participio concertado; ablativos absolutos.","official":true},{"id":"ciug-eut-2-21","author":"Eutropio","ref":"2, 21","latin":"L. Manlio Vulsone M. Atilio Regulo consulibus bellum in Africam translatum est. Contra Hamilcarem, Carthaginiensium ducem, in mari pugnatum victusque est. Nam perditis sexaginta quattuor navibus retro se recepit. Romani viginti duas amiserunt. Sed cum in Africam transissent, primam Clypeam, Africae civitatem, in deditionem acceperunt. Consules usque ad Carthaginem processerunt multisque castellis vastatis Manlius victor Romam rediit et viginti septem milia captivorum reduxit; Atilius Regulus in Africa remansit. Is contra Afros aciem instruxit. Contra tres Carthaginiensium duces dimicans victor fuit, decem et octo milia hostium cecidit, quinque milia cum decem et octo elephantis cepit, septuaginta quattuor civitates in fidem accepit. Tum victi Carthaginienses pacem a Romanis petiverunt.","model":"Siendo cónsules Lucio Manlio Vulsón y Marco Atilio Régulo, la guerra fue trasladada a África. Se combatió en el mar contra Amílcar, jefe de los cartagineses, y este fue vencido. Perdidas sesenta y cuatro naves, se retiró; los romanos perdieron veintidós. Pero, después de pasar a África, aceptaron la rendición de Clípea. Los cónsules avanzaron hasta Cartago y, devastadas muchas fortalezas, Manlio regresó victorioso a Roma con veintisiete mil prisioneros, mientras Atilio Régulo permaneció en África. Este dispuso la línea de batalla contra los africanos y venció a tres generales cartagineses: mató a dieciocho mil enemigos, capturó a cinco mil con dieciocho elefantes y recibió la sumisión de setenta y cuatro ciudades. Entonces los cartagineses vencidos pidieron la paz a los romanos.","cores":[["áfrica","africa"],["amílcar","amilcar"],["cartagineses"],["naves"],["clípea","clipea"],["cartago"],["prisioneros"],["elefantes"],["paz"]],"hint":"El texto combina ablativos absolutos, pasivas impersonales y varias principales narrativas.","syntax":"Ablativos absolutos; pasivas; cum temporal; coordinación narrativa.","official":true},{"id":"ciug-eut-3-14","author":"Eutropio","ref":"3, 14","latin":"Decimo anno postquam Hannibal in Italiam venerat, P. Sulpicio Cn. Fulvio consulibus, Hannibal usque ad quartum miliarium urbis accessit, equites eius usque ad portam. Mox consulum cum exercitu venientium metu Hannibal ad Campaniam se recepit. In Hispania a fratre eius Hasdrubale ambo Scipiones, qui per multos annos victores fuerant, interficiuntur, exercitus tamen integer mansit.","model":"En el décimo año después de que Aníbal hubiera llegado a Italia, siendo cónsules Publio Sulpicio y Gneo Fulvio, Aníbal se acercó hasta la cuarta milla de la ciudad y su caballería hasta la puerta. Poco después, por miedo a los cónsules que llegaban con el ejército, Aníbal se retiró a Campania. En Hispania, ambos Escipiones fueron muertos por Asdrúbal, hermano de Aníbal, aunque el ejército permaneció intacto.","cores":[["aníbal","anibal"],["italia"],["cónsules"],["campania"],["hispania"],["escipiones"],["asdrúbal","asdrubal"],["ejército"]],"hint":"P. Sulpicio Cn. Fulvio consulibus es ablativo absoluto de datación.","syntax":"Subordinada postquam; ablativo absoluto; genitivo con participio; pasiva; relativa.","official":true},{"id":"ciug-eut-3-15","author":"Eutropio","ref":"3, 15","latin":"Interea ad Hispanias, ubi occisis duobus Scipionibus nullus Romanus dux erat, P. Cornelius Scipio mittitur, filius P. Scipionis, qui ibidem bellum gesserat, annos natus quattuor et viginti, vir Romanorum omnium et sua aetate et posteriore tempore fere primus. Is Carthaginem Hispaniae capit, in qua omne aurum, argentum et belli apparatum Afri habebant, nobilissimos quoque obsides, quos ab Hispanis acceperant. Magonem etiam, fratrem Hannibalis, ibidem capit, quem Romam cum aliis mittit. Romae ingens laetitia post hunc nuntium fuit.","model":"Entretanto fue enviado a Hispania Publio Cornelio Escipión, hijo de Publio Escipión, donde, muertos los dos Escipiones, no había ningún general romano. Tenía veinticuatro años y fue casi el primero de todos los romanos tanto en su época como después. Tomó Cartago de Hispania, donde los africanos tenían todo el oro, la plata, el material de guerra y también rehenes muy nobles recibidos de los hispanos. Allí capturó también a Magón, hermano de Aníbal, y lo envió a Roma con otros. Tras esta noticia hubo gran alegría en Roma.","cores":[["publio cornelio escipión"],["hispania"],["veinticuatro"],["cartago"],["oro"],["plata"],["rehenes"],["magón","magon"],["alegría","alegria"]],"hint":"occisis duobus Scipionibus es ablativo absoluto; identifica las relativas con qui, qua, quos y quem.","syntax":"Ablativo absoluto; pasiva; aposiciones; relativas encadenadas.","official":true},{"id":"ciug-eut-4-16","author":"Eutropio","ref":"4, 16","latin":"Eodem tempore Metellus in Celtiberia apud Hispanos res egregias gessit. Successit ei Q. Pompeius. Nec multo post Q. Caepio ad idem bellum missus est, quod quidam Viriathus contra Romanos in Lusitania gerebat. Quo metu Viriathus a suis interfectus est, cum quattuordecim annis Hispanias adversus Romanos movisset. Pastor primo fuit, mox latronum dux, postremo tantos ad bellum populos concitavit, ut adsertor contra Romanos Hispaniae putaretur. Et cum interfectores eius praemium a Caepione consule peterent, responsum est numquam Romanis placuisse imperatores a suis militibus interfici.","model":"Por el mismo tiempo Metelo realizó grandes hazañas en Celtiberia entre los hispanos. Le sucedió Quinto Pompeyo y, poco después, Quinto Cepión fue enviado a la misma guerra, que un tal Viriato mantenía contra los romanos en Lusitania. Por miedo a este, Viriato fue asesinado por los suyos después de haber agitado Hispania contra Roma durante catorce años. Primero fue pastor, luego jefe de bandoleros y finalmente levantó tantos pueblos para la guerra que fue considerado defensor de Hispania contra los romanos. Cuando sus asesinos pidieron una recompensa al cónsul Cepión, se respondió que a los romanos nunca les había agradado que los generales fueran asesinados por sus propios soldados.","cores":[["metelo"],["celtiberia"],["viriato"],["lusitania"],["catorce"],["pastor"],["bandoleros"],["defensor"],["asesinados"]],"hint":"Atiende a la consecutiva ut... putaretur y a la construcción de infinitivo tras responsum est.","syntax":"Relativa; cum histórico; consecutiva; infinitiva en estilo indirecto.","official":true},{"id":"ciug-eut-6-12","author":"Eutropio","ref":"6, 12","latin":"Dum haec geruntur, piratae omnia maria infestabant ita, ut Romanis toto orbe victoribus sola navigatio tuta non esset. Quare id bellum Cn. Pompeio decretum est. Quod intra paucos menses ingenti et felicitate et celeritate confecit. Mox ei delatum etiam bellum contra regem Mithridatem et Tigranem. Quo suscepto Mithridatem in Armenia minore nocturno proelio vicit, castra diripuit, quadraginta milia eius occidit, viginti tantum de exercitu suo perdidit et duos centuriones. Mithridates cum uxore fugit et duobus comitibus.","model":"Mientras sucedían estas cosas, los piratas infestaban todos los mares hasta tal punto que, aunque los romanos eran vencedores en todo el mundo, solo la navegación no era segura. Por ello aquella guerra fue encomendada a Gneo Pompeyo, quien la terminó en pocos meses con enorme fortuna y rapidez. Poco después se le confió también la guerra contra los reyes Mitrídates y Tigranes. Emprendida esta, venció a Mitrídates en Armenia Menor en un combate nocturno, saqueó el campamento, mató a cuarenta mil hombres suyos y perdió solo veinte de su ejército y dos centuriones. Mitrídates huyó con su esposa y dos acompañantes.","cores":[["piratas"],["mares"],["navegación"],["pompeyo"],["mitrídates","mitridates"],["tigranes"],["armenia"],["cuarenta mil"],["huyó","huyo"]],"hint":"ita ut introduce una consecutiva; quo suscepto es ablativo absoluto.","syntax":"Dum temporal; consecutiva; pasivas; relativa; ablativo absoluto.","official":true},{"id":"ciug-eut-6-25","author":"Eutropio","ref":"6, 25","latin":"Caesar, bellis civilibus toto orbe conpositis, Romam rediit. Agere insolentius coepit et contra consuetudinem Romanae libertatis. Cum ergo et honores ex sua voluntate praestaret et alia regia et paene tyrannica faceret, coniuratum est in eum a sexaginta vel amplius senatoribus equitibusque Romanis. Ergo Caesar, cum senatus die inter ceteros venisset ad curiam, tribus et viginti vulneribus confossus est.","model":"César, terminadas las guerras civiles en todo el mundo, regresó a Roma. Comenzó a actuar con mayor arrogancia y contra la tradición de la libertad romana. Como concedía honores según su voluntad y hacía otras cosas propias de un rey y casi tiránicas, conspiraron contra él sesenta o más senadores y caballeros romanos. Así, cuando César acudió a la curia en día de sesión del Senado, fue atravesado por veintitrés heridas.","cores":[["césar","cesar"],["guerras civiles"],["roma"],["libertad romana"],["honores"],["conspiraron"],["senadores"],["curia"],["veintitrés","veintitres"]],"hint":"bellis civilibus... conpositis es ablativo absoluto; los dos cum son causales/temporales con subjuntivo.","syntax":"Ablativo absoluto; infinitivo complementario; cum histórico/causal; pasiva impersonal y personal.","official":true},{"id":"ciug-eut-7-8","author":"Eutropio","ref":"7, 8","latin":"Ita bellis toto orbe confectis Octavianus Augustus Romam rediit. Rem publicam per quadraginta et quattuor annos solus obtinuit. Ante enim duodecim annis cum Antonio et Lepido tenuerat. Ita ab initio principatus eius usque ad finem quinquaginta et sex anni fuerunt. Obiit autem septuagesimo sexto anno morte communi in oppido Campaniae Atella. Romae in campo Martio sepultus est, vir qui non inmerito ex maxima parte deo similis est putatus.","model":"Así, terminadas las guerras en todo el mundo, Octaviano Augusto regresó a Roma. Gobernó solo el Estado durante cuarenta y cuatro años; antes lo había compartido durante doce años con Antonio y Lépido. Desde el comienzo de su principado hasta el final transcurrieron cincuenta y seis años. Murió de muerte natural a los setenta y seis años en Atela, ciudad de Campania. Fue sepultado en Roma, en el Campo de Marte, como un hombre que no sin razón fue considerado en gran medida semejante a un dios.","cores":[["octaviano augusto"],["roma"],["cuarenta y cuatro"],["antonio"],["lépido","lepido"],["cincuenta y seis"],["setenta y seis"],["campo de marte"],["dios"]],"hint":"bellis... confectis es ablativo absoluto; identifica los complementos temporales y la relativa final.","syntax":"Ablativo absoluto; principales narrativas; pasiva; relativa.","official":true},{"id":"ciug-eut-7-12","author":"Eutropio","ref":"7, 12","latin":"Successit Tiberio C. Caesar, cognomento Caligula, sceleratissimus ac funestissimus et qui etiam Tiberi dedecora purgaverit. Bellum contra Germanos suscepit et ingressus Sueviam nihil strenue fecit. Stupra sororibus intulit, ex una etiam filiam agnovit. Cum adversum cunctos ingenti avaritia, libidine, crudelitate saeviret, interfectus in Palatio est anno aetatis vicesimo nono, imperii tertio, mense decimo dieque octavo.","model":"A Tiberio le sucedió Gayo César, llamado Calígula, extremadamente criminal y funesto. Emprendió la guerra contra los germanos y, entrando en Suevia, no hizo nada con energía. Violentó a sus hermanas e incluso reconoció una hija de una de ellas. Como se ensañaba contra todos con enorme avaricia, lujuria y crueldad, fue asesinado en el Palatino a los veintinueve años de edad, en el tercer año de su reinado, en el décimo mes y decimoctavo día.","cores":[["calígula","caligula"],["tiberio"],["germanos"],["suevia"],["hermanas"],["hija"],["avaricia"],["crueldad"],["asesinado"]],"hint":"ingressus es participio deponente con valor activo; cum... saeviret introduce la causa/circunstancia de la muerte.","syntax":"Aposición; relativa; participio deponente; cum causal; pasiva.","official":true},{"id":"ciug-eut-7-23","author":"Eutropio","ref":"7, 23","latin":"Domitianus mox accepit imperium, frater Titi iunior, Neroni aut Caligulae aut Tiberio similior quam patri vel fratri suo. Primis tamen annis moderatus in imperio fuit, mox ad ingentia vitia progressus libidinis, iracundiae, crudelitatis, avaritiae tantum in se odii concitavit, ut merita et patris et fratris aboleret. Interfecit nobilissimos e senatu. Dominum se et deum primus appellari iussit. Nullam sibi nisi auream et argenteam statuam in Capitolio passus est poni. Consobrinos suos interfecit. Superbia quoque in eo execrabilis fuit. Romae quoque multa opera fecit, in his Capitolium et Forum Transitorium, Divorum Porticus, Isium ac Serapium et Stadium. Interfectus est suorum coniuratione in Palatio anno aetatis quadragesimo quinto, imperii quinto decimo.","model":"Después recibió el poder Domiciano, hermano menor de Tito, más parecido a Nerón, Calígula o Tiberio que a su padre o a su hermano. En los primeros años fue moderado en el gobierno, pero después avanzó hacia enormes vicios de lujuria, ira, crueldad y avaricia, y provocó contra sí tanto odio que borró los méritos de su padre y de su hermano. Mató a los hombres más nobles del Senado. Fue el primero que ordenó que se le llamara señor y dios. No permitió que se colocara en el Capitolio ninguna estatua suya que no fuera de oro o plata. Mató a sus primos. También su soberbia fue detestable. Hizo en Roma numerosas obras, entre ellas el Capitolio, el Foro Transitorio, el Pórtico de los Dioses, el Iseo, el Serapeo y el Estadio. Fue asesinado por una conspiración de los suyos en el Palatino, a los cuarenta y cinco años de edad y en el decimoquinto año de su reinado.","cores":[["domiciano"],["tito"],["nerón","neron"],["crueldad"],["avaricia"],["senado"],["señor"],["dios"],["capitolio"],["asesinado"]],"hint":"tantum... ut introduce una consecutiva; appellari y poni son infinitivos pasivos.","syntax":"Comparación; participio deponente; consecutiva; infinitivas dependientes de iussit/passus est; pasiva.","official":true},{"id":"ciug-eut-8-2","author":"Eutropio","ref":"8, 2","latin":"Successit Nervae Ulpius Crinitus Traianus, natus Italicae in Hispania, familia antiqua magis quam clara. Nam pater eius primum consul fuit. Imperator autem apud Agrippinam in Galliis factus est. Rem publicam ita administravit, ut omnibus principibus merito praeferatur. Romani imperii, quod post Augustum defensum magis fuerat quam nobiliter ampliatum, fines longe lateque diffudit.","model":"A Nerva le sucedió Ulpio Crinito Trajano, nacido en Itálica, en Hispania, de una familia más antigua que ilustre. Su padre fue el primero de la familia en ser cónsul. Trajano fue proclamado emperador cerca de Agripina, en las Galias. Administró el Estado de tal manera que con razón es preferido a todos los príncipes. Extendió a lo largo y a lo ancho las fronteras del Imperio romano, que después de Augusto había sido más defendido que ampliado gloriosamente.","cores":[["trajano"],["nerva"],["itálica","italica"],["hispania"],["cónsul"],["emperador"],["imperio romano"],["fronteras"]],"hint":"natus es participio concertado; ita... ut introduce una consecutiva.","syntax":"Participio concertado; pasiva; consecutiva; relativa.","official":true},{"id":"ciug-eut-8-18","author":"Eutropio","ref":"8, 18","latin":"Hinc imperii Romani administrationem Septimius Severus accepit, oriundus ex Africa, provincia Tripolitana, oppido Lepti. Solus omni memoria et ante et postea ex Africa imperator fuit. Hic primum fisci advocatus, mox militaris tribunus, per multa deinde et varia officia atque honores usque ad administrationem totius rei publicae venit. Multa toto orbe Romano reparavit.","model":"Después de él recibió el gobierno del Imperio romano Septimio Severo, originario de África, de la provincia Tripolitana y de la ciudad de Leptis. Fue el único emperador procedente de África de todos los tiempos. Primero fue abogado del fisco, luego tribuno militar y, tras muchos y diversos cargos y honores, llegó hasta el gobierno de todo el Estado. Restauró muchas obras en todo el mundo romano.","cores":[["septimio severo"],["imperio romano"],["áfrica","africa"],["tripolitana"],["leptis"],["tribuno militar"],["estado"],["restauró","restauro"]],"hint":"oriundus concuerda con Septimius Severus; sigue la sucesión de cargos expresada por primum, mox, deinde.","syntax":"Participio/adjetivo concertado; aposiciones; enumeración; principales narrativas.","official":true},{"id":"ciug-ph-1-4","author":"Fedro","ref":"1, 4","latin":"Amittit merito proprium qui alienum appetit. Canis per flumen carnem dum ferret natans, lympharum in speculo vidit simulacrum suum, aliamque praedam ab altero ferri putans eripere voluit. Verum decepta aviditas et quem tenebat ore dimisit cibum nec quem petebat potuit adeo attingere.","model":"Pierde merecidamente lo propio quien desea lo ajeno. Mientras un perro atravesaba a nado un río llevando un trozo de carne, vio su imagen reflejada en el agua y, creyendo que otro llevaba otra presa, quiso arrebatársela. Pero su codicia quedó engañada: soltó el alimento que tenía en la boca y tampoco pudo alcanzar el que pretendía.","cores":[["pierde"],["propio"],["ajeno"],["perro"],["río","rio"],["carne"],["imagen"],["codicia"],["soltó","solto"]],"hint":"dum ferret introduce una circunstancia simultánea; putans rige una infinitiva pasiva.","syntax":"Relativa sustantivada; dum + subjuntivo; participio presente; ACI.","official":true},{"id":"ciug-ph-1-5","author":"Fedro","ref":"1, 5","latin":"Numquam est fidelis cum potente societas: testatur haec fabella propositum meum. Vacca et capella et patiens ovis iniuriae socii fuere cum leone in saltibus. Hi cum cepissent cervum vasti corporis, sic est locutus, partibus factis, leo: «Ego primam tollo, nominor quoniam leo; secundam, quia sum fortis, tribuetis mihi; tum, quia plus valeo, me sequetur tertia; malo afficietur, si quis quartam tetigerit». Sic totam praedam sola improbitas abstulit.","model":"Nunca es fiel una alianza con un poderoso: esta fábula demuestra mi afirmación. Una vaca, una cabra y una oveja paciente ante la injusticia se asociaron con un león en los bosques. Cuando capturaron un ciervo enorme, hechas las partes, habló así el león: «Yo tomo la primera porque me llaman león; la segunda me la daréis porque soy fuerte; la tercera me corresponderá porque valgo más; y sufrirá un mal quien toque la cuarta». Así la sola maldad se llevó toda la presa.","cores":[["alianza"],["poderoso"],["vaca"],["cabra"],["oveja"],["león","leon"],["ciervo"],["presa"],["maldad"]],"hint":"cum cepissent y partibus factis marcan el marco previo al discurso del león.","syntax":"Cum temporal; ablativo absoluto; discurso directo; causales; condicional.","official":true},{"id":"ciug-ph-1-10","author":"Fedro","ref":"1, 10","latin":"Quicumque turpi fraude semel innotuit, etiam si verum dicit, amittit fidem. Hoc adtestatur brevis Aesopi fabula. Lupus arguebat vulpem furti crimine; negabat illa se esse culpae proximam. Tunc iudex inter illos sedit simius. Uterque causam cum perorassent suam, dixisse fertur simius sententiam: «Tu non videris perdidisse quod petis; te credo subripuisse quod pulchre negas».","model":"Quien una vez se ha hecho conocido por un fraude vergonzoso pierde la credibilidad aunque diga la verdad. Lo demuestra esta breve fábula de Esopo. Un lobo acusaba a una zorra de robo; ella negaba ser culpable. Entonces un mono se sentó como juez entre ambos. Cuando los dos expusieron su causa, se cuenta que el mono dictó esta sentencia: «Tú no pareces haber perdido lo que reclamas; y creo que tú robaste aquello que tan bien niegas».","cores":[["fraude"],["credibilidad"],["lobo"],["zorra"],["robo"],["mono"],["juez"],["sentencia"],["robaste","robó","robo"]],"hint":"negabat illa se esse... contiene ACI; dixisse fertur es una construcción personal con infinitivo.","syntax":"Relativa indefinida; concesiva; ACI; cum temporal; infinitivo con fertur.","official":true},{"id":"ciug-ph-2-7","author":"Fedro","ref":"2, 7","latin":"Muli gravati sarcinis ibant duo: unus ferebat fiscos cum pecunia, alter tumentes multo saccos hordeo. Ille onere dives celsa it cervice eminens clarumque collo iactans tintinnabulum, comes quieto sequitur et placido gradu. Subito latrones ex insidiis advolant interque caedem ferro mulum sauciant, diripiunt nummos, neglegunt vile hordeum. Spoliatus igitur casus cum fleret suos, «equidem» inquit alter «me contemptum gaudeo; nam nil amisi nec sum laesus vulnere». Hoc argumento tuta est hominum tenuitas; magnae periclo sunt opes obnoxiae.","model":"Dos mulos caminaban cargados de fardos: uno llevaba cestas con dinero y el otro sacos llenos de cebada. El primero, orgulloso por su rica carga, avanzaba con el cuello erguido haciendo sonar un cascabel, mientras su compañero lo seguía con paso tranquilo. De repente unos ladrones saltaron desde una emboscada, hirieron al mulo, robaron el dinero y despreciaron la barata cebada. Cuando el despojado lloraba su desgracia, el otro dijo: «Yo me alegro de haber sido despreciado, pues no he perdido nada ni he sido herido». Este ejemplo muestra que la pobreza mantiene seguros a los hombres; las grandes riquezas están expuestas al peligro.","cores":[["mulos"],["dinero"],["cebada"],["ladrones"],["hirieron"],["robaron"],["pobreza"],["riquezas"],["peligro"]],"hint":"Observa los participios gravati, eminens, iactans y spoliatus; el relato alterna presente histórico y subordinadas.","syntax":"Participios concertados; presentes históricos; cum temporal; infinitivo pasivo.","official":true},{"id":"ciug-ph-3-17","author":"Fedro","ref":"3, 17","latin":"Olim quas vellent esse in tutela sua, divi legerunt arbores. Quercus Iovi et myrtus Veneri placuit, Phoebo laurea, pinus Cybelae, populus celsa Herculi. Minerva admirans, quare steriles sumerent interrogavit. Causam dixit Iuppiter: «Honorem fructu ne videamur vendere». «At mehercules narrabit quod quis voluerit, oliva nobis propter fructum est gratior». Tunc sic deorum genitor atque hominum sator: «O nata, merito sapiens dicere omnibus! Nisi utile est quod facimus, stulta est gloria». Nihil agere quod non prosit fabella admonet.","model":"En otro tiempo los dioses eligieron los árboles que querían tener bajo su protección. A Júpiter le agradó la encina, a Venus el mirto, a Febo el laurel, a Cibeles el pino y a Hércules el alto álamo. Minerva preguntó por qué escogían árboles estériles. Júpiter explicó la razón: «Para que no parezca que vendemos el honor por el fruto». «Por Hércules, que cada cual diga lo que quiera: el olivo nos es más grato por su fruto». Entonces el padre de los dioses y creador de los hombres dijo: «Hija, con razón todos te llaman sabia. Si lo que hacemos no es útil, la gloria es necia». La fábula aconseja no hacer nada que no sea provechoso.","cores":[["dioses"],["árboles","arboles"],["júpiter","jupiter"],["venus"],["minerva"],["estériles","esteriles"],["olivo"],["fruto"],["gloria"]],"hint":"quare steriles sumerent es interrogativa indirecta; ne videamur vendere es final negativa.","syntax":"Relativa; dativos; interrogativa indirecta; final negativa; condicional.","official":true},{"id":"ciug-ph-4-3","author":"Fedro","ref":"4, 3","latin":"Fame coacta vulpes alta in vinea uvam appetebat summis saliens viribus; quam tangere ut non potuit, discedens ait: «Nondum matura est; nolo acerbam sumere». Qui facere quae non possunt verbis elevant, ascribere hoc debebunt exemplum sibi.","model":"Obligada por el hambre, una zorra deseaba unas uvas en una viña alta, saltando con todas sus fuerzas. Como no pudo alcanzarlas, al marcharse dijo: «Todavía no están maduras; no quiero tomar uvas agrias». Quienes desprecian con palabras lo que no pueden hacer deberán aplicarse este ejemplo.","cores":[["hambre"],["zorra"],["uvas"],["viña","vina"],["maduras"],["agrias"],["ejemplo"]],"hint":"fame coacta y discedens son participios; analiza quam como relativo y ut non potuit según el contexto.","syntax":"Participios concertados; subordinada con ut; discurso directo; relativa sustantivada.","official":true},{"id":"ciug-ph-4-10","author":"Fedro","ref":"4, 10","latin":"Peras imposuit Iuppiter nobis duas: propriis repletam vitiis post tergum dedit, alienis ante pectus suspendit gravem. Hac re videre nostra mala non possumus; alii simul delinquunt, censores sumus.","model":"Júpiter nos puso dos alforjas: colocó detrás de la espalda la llena de nuestros propios defectos y suspendió delante del pecho la pesada con los ajenos. Por eso no podemos ver nuestros males; en cuanto los demás cometen una falta, nos convertimos en censores.","cores":[["júpiter","jupiter"],["dos"],["defectos"],["espalda"],["ajenos"],["pecho"],["males"],["censores"]],"hint":"repletam y gravem se refieren a pera sobreentendida; distingue propriis vitiis y alienis.","syntax":"Participios/adjetivos concertados; dativo nobis; infinitivo con possumus.","official":true},{"id":"ciug-ph-4-20","author":"Fedro","ref":"4, 20","latin":"Qui fert malis auxilium post tempus dolet. Gelu rigentem quidam colubram sustulit sinuque fovit contra se ipse misericors; namque ut refecta est, necuit hominem protinus. Hanc alia cum rogaret causam facinoris, respondit: «Ne quis discat prodesse improbis».","model":"Quien ayuda a los malos acaba lamentándolo. Un hombre recogió una culebra rígida por el frío y, compadecido, la calentó en su seno; pero, cuando se recuperó, mató inmediatamente al hombre. Cuando otra serpiente le preguntó la causa de su acción, respondió: «Para que nadie aprenda a hacer bien a los malvados».","cores":[["ayuda"],["malos"],["culebra"],["frío","frio"],["compasión"],["mató"],["serpiente"],["malvados"]],"hint":"gelu rigentem describe a colubram; ut refecta est introduce la circunstancia posteri /* ---------- ayuda morfológica ---------- */
let popLemma='';
function tokenHTML(item){
  if(item.tokens&&item.tokens.length){
    return item.tokens.map((t,i)=>`<button class="token" data-i="${i}">${esc(t[0])}</button>`).join(' ');
  }
  return esc(item.latin).replace(/([A-Za-z]+)/g, m=>`<button class="token auto-token" data-word="${m}">${m}</button>`);
}
function showWordPopover(button,lemma,meta,meaning,extra){
  popLemma=lemma;
  $('#popLemma').textContent=lemma;
  $('#popMeta').textContent=meta||'';
  $('#popMeaning').textContent=meaning||'';
  $('#popExtra').textContent=extra||'';
  const p=$('#wordPopover'); p.classList.add('show');
  const r=button.getBoundingClientRect(),w=Math.min(370,innerWidth-24);
  p.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';
  p.style.top=Math.max(12,Math.min(r.bottom+8,innerHeight-p.offsetHeight-12))+'px';
}
function attachHelp(el,item){
  el.querySelectorAll('.token').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.i!==undefined){
      const t=item.tokens[Number(b.dataset.i)];
      showWordPopover(b,t[1].split(',')[0],t[2]+' · '+t[3],t[4],'Abrir en VOX permite consultar la entrada completa.');
      return;
    }
    const surface=b.dataset.word||b.textContent.trim();
    let candidates=[];
    try{ candidates=searchLatin(surface).slice(0,4); }catch(e){}
    if(!candidates.length && /que$/i.test(surface)){
      try{ candidates=searchLatin(surface.slice(0,-3)).slice(0,4); }catch(e){}
    }
    const first=candidates[0];
    const summary=first ? first.raw : 'No se ha localizado una entrada directa para esta forma.';
    const more=candidates.length>1 ? ` ${candidates.length} coincidencias próximas en VOX.` : '';
    showWordPopover(
      b,
      surface,
      'Forma del texto · consulta automática',
      summary.length>260?summary.slice(0,257)+'…':summary,
      'Puede tratarse de una forma flexionada. Usa “Abrir en VOX” para revisar el lema y las posibles entradas.'+more
    );
  }));
}

$('#popOpenDict').addEventListener('click',()=>{$('#wordPopover').classList.remove('show');showView('translate');setDictTab('latin');$('#dictSearch').value=popLemma;dictQuery=popLemma;dictPage=0;renderDictionary();requestAnimationFrame(()=>$('#lexiconDock')?.scrollIntoView({behavior:'smooth',block:'start'}));});

function syncDictionaryToLemma(lemma){
  if(!lemma||!$('#dictSearch'))return;
  const q=String(lemma).split(',')[0].trim();
  if(!q)return;
  setDictTab('latin');
  $('#dictSearch').value=q;
  dictQuery=q;
  dictPage=0;
  renderDictionary();
}

/* ---------- traducción aleatoria ---------- */
let practiceKind='sentences', currentId=null, currentTranslation=null, hintStep=0;
const practiceQueues={sentences:[],texts:[]};
const practiceHistory={sentences:[],texts:[]};
const practiceCursor={sentences:-1,texts:-1};

function shuffledIds(kind){
  const ids=(CORPORA[kind]||[]).map(x=>x.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  return ids;
}
function refillQueue(kind){
  practiceQueues[kind]=shuffledIds(kind);
  const hist=practiceHistory[kind];
  const last=hist.length?hist[hist.length-1]:null;
  if(last && practiceQueues[kind].length>1 && practiceQueues[kind][practiceQueues[kind].length-1]===last){
    [practiceQueues[kind][0],practiceQueues[kind][practiceQueues[kind].length-1]]=[practiceQueues[kind][practiceQueues[kind].length-1],practiceQueues[kind][0]];
  }
}
function loadPracticeId(kind,id){
  practiceKind=kind;
  currentId=id;
  currentTranslation=(CORPORA[kind]||[]).find(x=>x.id===id)||null;
  renderTranslation();
}
function switchPractice(kind){
  practiceKind=kind;
  if(practiceCursor[kind]>=0 && practiceHistory[kind][practiceCursor[kind]]){
    loadPracticeId(kind,practiceHistory[kind][practiceCursor[kind]]);
  }else{
    nextRandomTranslation(kind);
  }
}
function nextRandomTranslation(kind=practiceKind){
  practiceKind=kind;
  const hist=practiceHistory[kind];
  if(practiceCursor[kind] < hist.length-1){
    practiceCursor[kind]++;
    loadPracticeId(kind,hist[practiceCursor[kind]]);
    return;
  }
  if(!practiceQueues[kind].length) refillQueue(kind);
  const id=practiceQueues[kind].pop();
  if(!id){currentTranslation=null;renderTranslation();return}
  hist.push(id);
  practiceCursor[kind]=hist.length-1;
  loadPracticeId(kind,id);
}
function previousTranslation(){
  const kind=practiceKind;
  if(practiceCursor[kind]<=0) return;
  practiceCursor[kind]--;
  loadPracticeId(kind,practiceHistory[kind][practiceCursor[kind]]);
}
function currentItem(){return currentTranslation}

function renderTranslation(){
  const item=currentItem();
  $$('.practice-tab').forEach(b=>{
    const active=b.dataset.practice===practiceKind;
    b.classList.toggle('active',active);
    b.setAttribute('aria-selected',active?'true':'false');
  });
  $('#translationFeedback').className='feedback';
  $('#translationFeedback').innerHTML='';
  $('#analysisBox').className='analysis';
  $('#analysisBox').innerHTML='';
  $('#semanticChecklist').innerHTML='';
  $('#translationInput').value='';
  $('#hintBox').style.display='none';
  $('#hintBox').innerHTML='';
  hintStep=0;
  const latin=$('#latinText');
  latin.classList.toggle('text-mode',practiceKind==='texts');
  latin.classList.remove('swap'); void latin.offsetWidth; latin.classList.add('swap');
  $('#prevTranslation').disabled=practiceCursor[practiceKind]<=0;
  if(!item){
    latin.innerHTML='<div class="empty">No hay material disponible.</div>';
    $('#translationSource').innerHTML='';
    return;
  }
  latin.innerHTML=tokenHTML(item);
  attachHelp(latin,item);
  if(practiceKind==='texts'){
    const author=item.author?esc(item.author):'';
    const ref=item.ref?esc(item.ref):'';
    $('#translationSource').innerHTML=[author,ref].filter(Boolean).join(' · ');
  }else{
    $('#translationSource').innerHTML='';
  }
}
$$('.practice-tab').forEach(b=>b.addEventListener('click',()=>switchPractice(b.dataset.practice)));
$('#nextTranslation').addEventListener('click',()=>nextRandomTranslation(practiceKind));
$('#prevTranslation').addEventListener('click',previousTranslation);
$('#showHint').addEventListener('click',()=>{
  const x=currentItem();if(!x)return;hintStep++;
  const h=$('#hintBox');h.style.display='block';
  h.innerHTML=hintStep===1?`<strong>Pista:</strong> ${esc(x.hint)}`:
    hintStep===2?`<strong>Estructura:</strong> ${esc(x.syntax)}`:
    'Pulsa una palabra latina para consultar su análisis y el VOX.';
});
$('#showModel').addEventListener('click',()=>{
  const x=currentItem();if(!x)return;const f=$('#translationFeedback');
  f.className='feedback show warn';f.innerHTML=`<strong>Modelo de traducción</strong>${esc(x.model)}`;
});
$('#showAnalysisBtn').addEventListener('click',()=>{
  const x=currentItem(),b=$('#analysisBox');if(!x)return;b.classList.toggle('show');if(b.innerHTML)return;
  if(x.tokens&&x.tokens.length){
    b.innerHTML=`<h3>Análisis</h3><div class="notice"><strong>Estructura:</strong> ${esc(x.syntax)}</div>${x.tokens.map(t=>`<div class="analysis-row"><b>${esc(t[0])}</b><span>${esc(t[1])}<br><span class="muted">${esc(t[2])}</span></span><span>${esc(t[3])}<br>${esc(t[4])}</span></div>`).join('')}`;

$('#checkTranslation').addEventListener('click',()=>{
  const x=currentItem(),ans=normText($('#translationInput').value);if(!x)return;
  const f=$('#translationFeedback');
  if(!ans){f.className='feedback show warn';f.innerHTML='<strong>Sin respuesta</strong>Escribe una traducción antes de corregir.';return}
  const checks=x.cores.map(g=>({key:g[0],ok:g.some(t=>ans.includes(normText(t)))}));
  const hits=checks.filter(c=>c.ok).length,pct=Math.round(hits/checks.length*100);
  const contradiction=/\\b(no|nunca|jamás|jamas|tampoco|sin)\\b/.test(ans)!==/\\b(no|nunca|jamás|jamas|tampoco|sin)\\b/.test(normText(x.model));
  const good=pct>=80&&!contradiction;
  $('#semanticChecklist').innerHTML=checks.map(c=>`<li class="${c.ok?'ok':'miss'}">${c.ok?'✓':'○'} ${esc(c.key)}</li>`).join('');
  f.className='feedback show '+(good?'good':pct>=55?'warn':'bad');
  f.innerHTML=`<strong>${good?'Coincidencias orientativas detectadas':'Revisión necesaria'}</strong>${hits} de ${checks.length} elementos esenciales reconocidos. ${contradiction?'Atención: la negación cambia el sentido. ':''}Esta comprobación no sustituye la revisión gramatical de una traducción abierta. Consulta «Modelo».`;
});

let dictTab='latin',dictQuery='',dictLetter='A',dictPage=0;const PAGE_SIZE=36;let dictResults=[];
function distance(a,b,max=2){if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i],min=i;for(let j=1;j<=b.length;j++){const v=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c.push(v);if(v<min)min=v}if(min>max)return max+1;p=c}return p[b.length]}
function highlight(text,q){if(!q)return esc(text);const safe=esc(text),needle=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return safe.replace(new RegExp('('+needle+')','ig'),'<mark>$1</mark>')}catch(e){return safe}}
function searchLatin(q){prepareVox();const n=normHead(q),t=normText(q);if(!n)return VOX.filter(e=>(e._h||'')[0]?.toUpperCase()===dictLetter);const exact=[],prefix=[],contains=[],raw=[];for(const e of VOX){if(e._h===n)exact.push(e);else if(e._h.startsWith(n))prefix.push(e);else if(e._h.includes(n))contains.push(e);else if(t.length>=3&&e._r.includes(t))raw.push(e)}let out=[...exact,...prefix,...contains,...raw];if(out.length<30&&n.length>=4){const fuzzy=[];for(const e of VOX){if(out.includes(e))continue;if(Math.abs(e._h.length-n.length)>2)continue;if(e._h[0]!==n[0])continue;const d=distance(n,e._h,n.length>=7?2:1);if(d<=(n.length>=7?2:1))fuzzy.push([d,e])}fuzzy.sort((a,b)=>a[0]-b[0]);out.push(...fuzzy.map(x=>x[1]))}return out}
const BAD_REVERSE_HEADS=new Set(['m','f','n','pl','sg','sing','adj','adv','tr','intr','prep','conj','pron','subst','sust','perf','gen','dat','abl','ac','nom','pres','inf','part','pp','dep','irr']);
function glossNorm(e){if(e._g!==undefined)return e._g;const r=e.raw||'';const c=r.indexOf(':');if(c<0||c>140){e._g='';return e._g}let g=r.slice(c+1,c+360);const par=g.indexOf('(');if(par>=8)g=g.slice(0,par);e._g=normText(g);return e._g}
function searchSpanish(q){prepareVox();const t=normText(q);if(!t)return[];const out=[];for(const e of VOX){if(BAD_REVERSE_HEADS.has(e._h))continue;const g=glossNorm(e),ig=g.indexOf(t),ir=e._r.indexOf(t);if(ig>=0)out.push([ig-(e.verified?40:0),e]);else if(ir>=0)out.push([1000+ir-(e.verified?40:0),e])}out.sort((a,b)=>a[0]-b[0]||a[1].page_pdf-b[1].page_pdf);return out.map(x=>x[1])}
function alphabet(){prepareVox();const letters=[...new Set(VOX.map(e=>(e._h||'')[0]?.toUpperCase()).filter(x=>/[A-Z]/.test(x)))].sort();$('#alphabet').innerHTML=letters.map(l=>`<button class="${l===dictLetter&&!dictQuery?'active':''}" data-l="${l}">${l}</button>`).join('');$('#alphabet').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{dictLetter=b.dataset.l;dictQuery='';$('#dictSearch').value='';dictPage=0;renderDictionary()}))}

function entryCard(e,q,reverse=false){const raw=e.raw.startsWith(e.head)?e.raw:e.raw;return `<article class="entry"><h4>${esc(e.head)}</h4><button class="scan" data-page="${e.page_pdf}">Buscar en diccionario externo</button><div class="raw">${highlight(raw,q)}</div><div class="meta"><span>PDF ${e.page_pdf}</span><span>·</span><span>pág. impresa ${e.page_printed}</span>${e.verified?'<span class="pill">revisada</span>':''}</div></article>`}
function renderDictionary(){prepareVox();alphabet();$('#dictNote').textContent=dictTab==='latin'?`${DICT_TOTAL} lemas del banco de aprendizaje; consulta más en el diccionario externo.`:dictTab==='spanish'?'Consulta inversa del léxico didáctico.':'Visor de las páginas originales del PDF.';$('#dictModeMetric').textContent=dictTab==='latin'?'Léxico didáctico':dictTab==='spanish'?'Índice inverso':'PDF original';if(dictTab==='pdf'){renderPdf(pdfPage);return}dictResults=dictTab==='latin'?searchLatin(dictQuery):searchSpanish(dictQuery);const total=dictResults.length,pages=Math.max(1,Math.ceil(total/PAGE_SIZE));dictPage=Math.min(dictPage,pages-1);const slice=dictResults.slice(dictPage*PAGE_SIZE,(dictPage+1)*PAGE_SIZE);$('#dictTitle').textContent=dictTab==='latin'?'Latín → español':'Español → latín';$('#dictMetric').textContent=total.toLocaleString('es-ES')+' resultados';$('#dictList').innerHTML=slice.length?slice.map(e=>entryCard(e,dictQuery,dictTab==='spanish')).join(''):'<div class="empty">Sin resultados.</div>';$('#dictPageInfo').textContent=pages>1?`${dictPage+1} / ${pages}`:'';$('#dictPrev').disabled=dictPage===0;$('#dictNext').disabled=dictPage>=pages-1;$('#dictList').querySelectorAll('.scan').forEach(b=>b.addEventListener('click',()=>openPdfPage(Number(b.dataset.page))))}
let searchTimer;$('#dictSearch').addEventListener('input',e=>{dictQuery=e.target.value.trim();dictPage=0;clearTimeout(searchTimer);searchTimer=setTimeout(renderDictionary,120)});$('#clearDict').addEventListener('click',()=>{dictQuery='';$('#dictSearch').value='';dictPage=0;renderDictionary()});$('#dictPrev').addEventListener('click',()=>{if(dictPage>0){dictPage--;renderDictionary();scrollTo({top:0,behavior:'smooth'})}});$('#dictNext').addEventListener('click',()=>{const pages=Math.ceil(dictResults.length/PAGE_SIZE);if(dictPage<pages-1){dictPage++;renderDictionary();scrollTo({top:0,behavior:'smooth'})}});
let pdfPage=16;function openPdfPage(p){pdfPage=p;setDictTab('pdf')}function renderPdf(p){$('#dictTitle').textContent='Original digitalizado';$('#dictMetric').textContent='PDF · página '+p;$('#dictList').innerHTML=`<div class="pdf-tools"><label>Página PDF <input id="pdfPageInput" type="text" value="${p}" style="width:82px"></label><button class="btn secondary" id="pdfGo">Ir</button><button class="btn secondary" id="pdfOpen">Abrir en otra pestaña</button></div><div class="pdf-frame"><object id="pdfObject" data="./Diccionario Vox español-latino.pdf#page=${p}&zoom=page-width" type="application/pdf"><div class="empty">Para ver el escaneo dentro de la app, coloca <strong>Diccionario Vox español-latino.pdf</strong> en la misma carpeta que este HTML. La búsqueda digital funciona aunque el PDF no esté disponible.</div></object></div>`;$('#pdfGo')?.addEventListener('click',()=>{const v=Math.max(1,Math.min(571,parseInt($('#pdfPageInput')?.value)||1));pdfPage=v;renderPdf(v)});$('#pdfOpen')?.addEventListener('click',()=>window.open('./Diccionario Vox español-latino.pdf#page='+p,'_blank'))}
renderDictionary();


// V9 · movimiento ambiental muy suave del fresco
(()=>{
  const root=document.documentElement;
  let tx=0,ty=0,cx=0,cy=0,raf=0;
  const step=()=>{cx+=(tx-cx)*.055;cy+=(ty-cy)*.055;root.style.setProperty('--bgx',cx.toFixed(2)+'px');root.style.setProperty('--bgy',cy.toFixed(2)+'px');raf=requestAnimationFrame(step)};
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*12;ty=(e.clientY/innerHeight-.5)*8},{passive:true});
    raf=requestAnimationFrame(step);
  }
})();
</script>
