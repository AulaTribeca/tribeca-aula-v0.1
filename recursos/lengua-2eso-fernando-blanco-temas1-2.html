function newTry(){const q=pools[memory.topic][memory.step];memory.answers[q.uid]={value:'',checked:false};persist();draw();}
function nextPractice(step){const qs=pools[memory.topic];if(step>=qs.length){if(memory.topic<sections.length-1){memory.topic++;memory.step=0;}else{return go('exam');}}else if(step<0){if(memory.topic>0){memory.topic--;memory.step=pools[memory.topic].length-1;}}else memory.step=step;persist();draw();scrollTopView();}
function submitExam(){if(memory.examResult)return;const totalAnswered=Object.values(memory.examAnswers).filter(function(v){return String(v).trim()!=='';}).length;if(totalAnswered<50&&!confirm('Has respondido '+totalAnswered+' de 50 apartados. Los que dejes en blanco valdrán 0 puntos. ¿Corregir ahora?'))return;let correct=0;const details=[];examPlan.forEach(function(g,gi){examQuestions(gi).forEach(function(q,qi){const v=getExamValue(q),ok=isCorrect(q,v);if(ok)correct++;details.push({item:gi+1+'.'+(qi+1),question:q.q,answer:v,correct:first(q),ok:ok});});});const score=Math.round(correct*20)/100;const timestamp=new Date().toISOString();const attempt={score:score,correct:correct,timestamp:timestamp,details:details};memory.examResult=attempt;memory.history.push({score:score,correct:correct,timestamp:timestamp});memory.examPage=0;persist();draw();scrollTopView();
try{const id=materialId;if(id&&window.parent!==window){const attemptId=(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2));window.parent.postMessage({type:'TRIBECA_EXTERNAL_ATTEMPT_V245',materialId:id,attempt:{attemptId:attemptId,score:score,max_score:10,total:50,correct:correct,checked:50,percent:score*10,title:'Lengua castellana · Examen temas 1 y 2',subject:'Lengua Castellana y Literatura',completed_at:timestamp,correction:{items:details}}},location.origin);}}catch(e){console.warn('No se ha podido comunicar el resultado al aula.',e);}
}
function resetExam(){if(!confirm('¿Iniciar un nuevo examen? Se conserva tu historial de notas, pero se vacían las respuestas de este intento.'))return;memory.examAnswers={};memory.examResult=null;memory.examPage=0;persist();draw();scrollTopView();}
document.addEventListener('click',function(ev){const target=ev.target.closest('button');if(!target)return;if(target.dataset.nav){go(target.dataset.nav,target.dataset.nav==='practice'?memory.topic:undefined);return;}if(target.dataset.section!=null){memory.step=0;go('practice',Number(target.dataset.section));return;}
if(target.dataset.opt!=null){if(memory.mode==='practice'){const q=pools[memory.topic][memory.step];if(memory.answers[q.uid]&&memory.answers[q.uid].checked)return;memory.answers[q.uid]={value:target.dataset.opt,checked:false};persist();draw();}else if(memory.mode==='exam'&&!memory.examResult){const index=Number(memory.examPage)||0;const card=target.closest('.examQ');const cards=Array.from(document.querySelectorAll('.examQ'));const qi=cards.indexOf(card);if(qi<0)return;const q=examQuestions(index)[qi];memory.examAnswers[q.uid]=target.dataset.opt;persist();draw();}return;}
if(target.hasAttribute('data-check'))recordPractice();else if(target.hasAttribute('data-retry'))newTry();else if(target.hasAttribute('data-prev'))nextPractice(memory.step-1);else if(target.hasAttribute('data-next'))nextPractice(memory.step+1);else if(target.hasAttribute('data-exam-next')){memory.examPage=Math.min(9,memory.examPage+1);persist();draw();scrollTopView();}else if(target.hasAttribute('data-exam-prev')){memory.examPage=Math.max(0,memory.examPage-1);persist();draw();scrollTopView();}else if(target.hasAttribute('data-exam-submit'))submitExam();else if(target.hasAttribute('data-exam-reset'))resetExam();else if(target.hasAttribute('data-print'))window.print();
});
document.addEventListener('input',function(ev){const el=ev.target;if(!el.matches('[data-text-answer]'))return;if(memory.mode==='practice'){const q=pools[memory.topic][memory.step];memory.answers[q.uid]={value:el.value,checked:false};}else if(memory.mode==='exam'&&!memory.examResult){const cards=Array.from(document.querySelectorAll('.examQ'));const qi=cards.indexOf(el.closest('.examQ'));const q=examQuestions(memory.examPage)[qi];if(q)memory.examAnswers[q.uid]=el.value;}persist();});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.matches('[data-text-answer]')&&memory.mode==='practice'){ev.preventDefault();recordPractice();}});
const mistakes=[];
sections.forEach(function(s,i){pools[i].forEach(function(q){if(q.choices&&!q.choices.includes(first(q)))mistakes.push('Opción incorrecta en '+q.uid);if(!q.q||!q.a)mistakes.push('Pregunta vacía '+q.uid);});});
examPlan.forEach(function(g,i){if(g.picks.length!==5)mistakes.push('Examen '+i+' no tiene cinco apartados');g.picks.forEach(function(p){if(!pools[g.idx][p])mistakes.push('Pregunta de examen inexistente '+i+'/'+p);});});
if(mistakes.length){document.querySelector('#view').innerHTML='<h2>No se puede cargar el ejercicio</h2><p>Se ha detectado un error de integridad. No se muestran preguntas incompletas.</p>';console.error(mistakes);return;}
draw();
})();
</script></body></html>
