<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radicales · Matemáticas 3.º ESO</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--ink:#20262b;--muted:#667179;--line:#dbe0e3;--accent:#315f56;--accent-soft:#e9f1ef;--good:#245f45;--good-bg:#e8f3ed;--bad:#8a3030;--bad-bg:#f9e9e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55}
button,input{font:inherit}button{cursor:pointer}#app{max-width:980px;margin:auto;padding:14px 14px 40px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding:4px 0 12px}
.title{font-size:1.18rem;font-weight:800}.sub,.meta,.small{font-size:.86rem;color:var(--muted)}.meta{text-align:right}.progress{height:8px;background:#e2e6e8;border-radius:999px;overflow:hidden;margin:14px 0 16px}.progress span{display:block;height:100%;background:var(--accent);width:0}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.nav button{min-height:42px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.nav button.done::after{content:" ✓";font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}h2{font-size:1.3rem;margin:0 0 12px}.theory{border-left:3px solid var(--accent);padding-left:14px}.example{margin:16px 0;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fafbfb}.practice{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:17px;margin-top:17px}.practice h3{margin:0}
.q{border:1px solid var(--line);border-radius:11px;padding:14px;margin:10px 0}.qp{font-weight:700;line-height:1.65;margin-bottom:10px}.opts{display:grid;gap:8px}.opt{min-height:48px;border:1px solid #b4bec3;border-radius:9px;background:#fff;text-align:left;padding:9px 12px}.opt.sel{border:2px solid var(--accent);background:var(--accent-soft)}.inp{width:min(100%,300px);min-height:46px;border:1px solid #aeb8bd;border-radius:9px;padding:9px 11px}
.qa,.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.footer{justify-content:space-between;margin-top:18px}.btn{min-height:43px;padding:8px 12px;border-radius:8px;border:1px solid transparent;font-weight:750}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border-color:#9faab0}.light{background:#fff;border-color:var(--line);color:var(--muted)}.fb{margin-top:10px;padding:9px 11px;border-radius:8px}.fb.ok{background:var(--good-bg);color:var(--good)}.fb.bad{background:var(--bad-bg);color:var(--bad)}.sol{margin-top:9px;padding:11px;border-left:3px solid var(--accent);background:#f7f9f8}
.frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .13em}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em .08em}.frac>span:last-child{padding:.08em .2em 0}
@media(max-width:680px){body{font-size:16px}#app{padding:9px}.card{padding:16px 13px}.top{flex-direction:column}.meta{text-align:left}.nav button{flex:1 1 120px}.footer .btn{flex:1 1 130px}}
</style></head><body><main id="app">
<header class="top"><div><div class="title">Radicales · Matemáticas 3.º ESO</div><div class="sub">Explicaciones, ejemplos y práctica autocorregible</div></div><div class="meta"><div id="pt"></div><div id="mix"></div></div></header>
<div class="progress"><span id="bar"></span></div><nav id="nav" class="nav"></nav><section id="card" class="card"></section>
</main><script>
(function(){"use strict";
const DATA=[{"title": "1. Radicales: cálculo y simplificación", "theory": "Un radical ⁿ√a tiene índice n y radicando a. Si no se escribe índice, es 2. Un radical exacto se calcula buscando una potencia perfecta. Si no es exacto, se simplifica extrayendo del radical factores que sean potencias perfectas del índice.", "example": "<b>Ejemplo:</b> √72 = √(36·2) = √36·√2 = <b>6√2</b>.", "questions": [{"id": "m1q1", "type": "number", "prompt": "Calcula √196.", "answer": 14, "solution": "14²=196, luego <b>√196=14</b>."}, {"id": "m1q2", "type": "mcq", "prompt": "Simplifica √48.", "options": ["4√3", "3√5", "2√12", "8√3"], "answer": "4√3", "solution": "48=16·3 ⇒ √48=√16·√3=<b>4√3</b>."}, {"id": "m1q3", "type": "mcq", "prompt": "Simplifica ³√54.", "options": ["3³√2", "2³√3", "9³√2", "3√2"], "answer": "3³√2", "solution": "54=27·2 ⇒ ³√54=³√27·³√2=<b>3³√2</b>."}, {"id": "m1q4", "type": "mcq", "prompt": "¿Cuál es un radical exacto?", "options": ["√45", "√64", "³√20", "√50"], "answer": "√64", "solution": "64=8² ⇒ <b>√64=8</b>."}]}, {"title": "2. Potencias de exponente fraccionario", "theory": "La relación fundamental es a^(m/n) = ⁿ√(a^m) = (ⁿ√a)^m. El denominador del exponente pasa a ser el índice del radical y el numerador queda como exponente.", "example": "<b>Ejemplo:</b> 64^(2/3) = (³√64)² = 4² = <b>16</b>.", "questions": [{"id": "m2q1", "type": "mcq", "prompt": "Escribe 5^(3/2) en forma radical.", "options": ["√(5³)", "³√(5²)", "√(3⁵)", "5√3"], "answer": "√(5³)", "solution": "El denominador 2 es el índice y 3 queda como exponente: <b>√(5³)</b>."}, {"id": "m2q2", "type": "number", "prompt": "Calcula 27^(2/3).", "answer": 9, "solution": "27^(2/3)=(³√27)²=3²=<b>9</b>."}, {"id": "m2q3", "type": "number", "prompt": "Calcula 16^(3/4).", "answer": 8, "solution": "16^(3/4)=(⁴√16)³=2³=<b>8</b>."}, {"id": "m2q4", "type": "mcq", "prompt": "¿Qué potencia equivale a ⁵√(x³)?", "options": ["x^(3/5)", "x^(5/3)", "x^15", "x^(2/5)"], "answer": "x^(3/5)", "solution": "⁵√(x³)=<b>x^(3/5)</b>."}]}, {"title": "3. Radicales equivalentes", "theory": "Dos radicales pueden representar el mismo número. Multiplicar el índice y el exponente del radicando por el mismo número no cambia el valor: ⁿ√(a^m) = ᵏⁿ√(a^(km)). También podemos simplificar índice y exponente si tienen un divisor común.", "example": "<b>Ejemplo:</b> ³√(2²) = ⁶√(2⁴) = ⁶√16.", "questions": [{"id": "m3q1", "type": "mcq", "prompt": "¿Cuál es equivalente a √3?", "options": ["⁴√9", "⁴√3", "³√9", "⁶√9"], "answer": "⁴√9", "solution": "√3=²√(3¹). Multiplicando índice y exponente por 2: <b>⁴√(3²)=⁴√9</b>."}, {"id": "m3q2", "type": "mcq", "prompt": "¿Cuál es equivalente a ³√(5²)?", "options": ["⁶√(5⁴)", "⁶√(5²)", "⁹√(5³)", "³√(5⁴)"], "answer": "⁶√(5⁴)", "solution": "Multiplicamos índice y exponente por 2: <b>⁶√(5⁴)</b>."}, {"id": "m3q3", "type": "mcq", "prompt": "Simplifica ⁶√(2⁴) usando equivalencia.", "options": ["³√(2²)", "³√2", "√(2²)", "²√(2³)"], "answer": "³√(2²)", "solution": "Dividimos índice 6 y exponente 4 entre 2: <b>³√(2²)</b>."}, {"id": "m3q4", "type": "mcq", "prompt": "¿Qué pareja contiene radicales equivalentes?", "options": ["√2 y ⁴√4", "√2 y ³√4", "³√2 y ⁶√2", "√3 y ⁶√9"], "answer": "√2 y ⁴√4", "solution": "√2=²√(2¹)=<b>⁴√(2²)=⁴√4</b>."}]}, {"title": "4. Reducción a índice común", "theory": "Para poner radicales con el mismo índice: 1) calculamos el m.c.m. de los índices; 2) transformamos cada radical en uno equivalente con ese nuevo índice.", "example": "<b>Ejemplo:</b> √2 y ³√4. m.c.m.(2,3)=6. √2=⁶√(2³)=⁶√8; ³√4=⁶√(4²)=⁶√16.", "questions": [{"id": "m4q1", "type": "mcq", "prompt": "Reduce √3 y ⁴√5 a índice común.", "options": ["⁴√9 y ⁴√5", "⁸√3 y ⁸√5", "⁴√3 y ⁴√25", "⁶√27 y ⁶√25"], "answer": "⁴√9 y ⁴√5", "solution": "m.c.m.(2,4)=4. √3=⁴√(3²)=<b>⁴√9</b>; ⁴√5 no cambia."}, {"id": "m4q2", "type": "mcq", "prompt": "Reduce ³√2 y √5 a índice común.", "options": ["⁶√4 y ⁶√125", "⁶√8 y ⁶√25", "⁵√4 y ⁵√125", "⁶√2 y ⁶√5"], "answer": "⁶√4 y ⁶√125", "solution": "m.c.m.(3,2)=6. ³√2=⁶√(2²)=⁶√4; √5=⁶√(5³)=<b>⁶√125</b>."}, {"id": "m4q3", "type": "mcq", "prompt": "¿Cuál es el índice común mínimo para índices 4 y 6?", "options": ["10", "12", "24", "2"], "answer": "12", "solution": "m.c.m.(4,6)=<b>12</b>."}, {"id": "m4q4", "type": "mcq", "prompt": "Reduce ⁴√(3³) y ⁶√(2⁵) al menor índice común.", "options": ["¹²√(3⁹) y ¹²√(2¹⁰)", "²⁴√(3¹⁸) y ²⁴√(2²⁰)", "¹²√(3⁶) y ¹²√(2¹⁰)", "¹⁰√(3⁶) y ¹⁰√(2¹⁰)"], "answer": "¹²√(3⁹) y ¹²√(2¹⁰)", "solution": "m.c.m.(4,6)=12. Multiplicamos 4→12 por 3 y 6→12 por 2: <b>¹²√(3⁹) y ¹²√(2¹⁰)</b>."}]}, {"title": "5. Producto y cociente de radicales", "theory": "Con el mismo índice: ⁿ√a · ⁿ√b = ⁿ√(ab) y ⁿ√a ÷ ⁿ√b = ⁿ√(a/b). Después se simplifica el resultado. Si los índices son distintos, primero se reducen a índice común.", "example": "<b>Ejemplo:</b> √6·√24=√144=<b>12</b>.", "questions": [{"id": "m5q1", "type": "number", "prompt": "Calcula √8·√2.", "answer": 4, "solution": "√8·√2=√16=<b>4</b>."}, {"id": "m5q2", "type": "number", "prompt": "Calcula ³√4·³√16.", "answer": 4, "solution": "³√4·³√16=³√64=<b>4</b>."}, {"id": "m5q3", "type": "number", "prompt": "Calcula √75 ÷ √3.", "answer": 5, "solution": "√75÷√3=√25=<b>5</b>."}, {"id": "m5q4", "type": "mcq", "prompt": "Simplifica 2√3·3√6.", "options": ["18√2", "6√18", "5√9", "12√3"], "answer": "18√2", "solution": "2√3·3√6=6√18=6√(9·2)=<b>18√2</b>."}]}, {"title": "6. Suma y resta de radicales", "theory": "Solo se pueden sumar o restar directamente radicales semejantes: mismo índice y mismo radicando. Antes de operar, simplifica todos los radicales. Después se suman o restan únicamente los coeficientes.", "example": "<b>Ejemplo:</b> √12+√27=2√3+3√3=<b>5√3</b>.", "questions": [{"id": "m6q1", "type": "mcq", "prompt": "Simplifica 4√5+3√5−2√5.", "options": ["5√5", "9√5", "5√15", "√5"], "answer": "5√5", "solution": "(4+3−2)√5=<b>5√5</b>."}, {"id": "m6q2", "type": "mcq", "prompt": "Simplifica √18+√8.", "options": ["5√2", "2√26", "√26", "3√2"], "answer": "5√2", "solution": "√18=3√2 y √8=2√2 ⇒ <b>5√2</b>."}, {"id": "m6q3", "type": "mcq", "prompt": "Simplifica 2√12−√27.", "options": ["√3", "7√3", "√39", "−√3"], "answer": "√3", "solution": "2√12=4√3 y √27=3√3 ⇒ <b>√3</b>."}, {"id": "m6q4", "type": "mcq", "prompt": "¿Cuál NO se puede reducir a un único radical semejante?", "options": ["√8+√18", "√12+√27", "√2+√3", "2√20−√45"], "answer": "√2+√3", "solution": "√2 y √3 ya están simplificados y tienen distinto radicando: <b>no son semejantes</b>."}]}, {"title": "7. Raíz de una raíz", "theory": "Una raíz dentro de otra raíz se transforma en un solo radical multiplicando los índices: ᵐ√(ⁿ√a)=ᵐⁿ√a. Luego se simplifica si es posible.", "example": "<b>Ejemplo:</b> √(³√64)=⁶√64=<b>2</b>, porque 64=2⁶.", "questions": [{"id": "m7q1", "type": "mcq", "prompt": "Expresa √(⁴√7) como un solo radical.", "options": ["⁸√7", "⁶√7", "⁴√49", "²√(7⁴)"], "answer": "⁸√7", "solution": "Multiplicamos índices: 2·4=8 ⇒ <b>⁸√7</b>."}, {"id": "m7q2", "type": "number", "prompt": "Calcula ³√(√729).", "answer": 3, "solution": "³√(√729)=⁶√729. Como 729=3⁶, resulta <b>3</b>."}, {"id": "m7q3", "type": "mcq", "prompt": "Simplifica √(³√(x⁶)), suponiendo x≥0.", "options": ["x", "x²", "⁵√(x⁶)", "x³"], "answer": "x", "solution": "√(³√(x⁶))=⁶√(x⁶)=<b>x</b>."}, {"id": "m7q4", "type": "mcq", "prompt": "¿Qué índice tendrá ⁴√(³√a) como un solo radical?", "options": ["12", "7", "4", "3"], "answer": "12", "solution": "4·3=<b>12</b>."}]}, {"title": "8. Repaso mixto", "theory": "Ahora se mezclan todos los procedimientos. Antes de operar: simplifica, comprueba los índices, identifica la propiedad necesaria y vuelve a simplificar el resultado.", "example": "<b>Estrategia:</b> no operes de memoria. Identifica primero si necesitas simplificar, buscar radicales semejantes, reducir a índice común o aplicar una propiedad.", "questions": [{"id": "m8q1", "type": "mcq", "prompt": "Simplifica √50+2√8−√18.", "options": ["6√2", "4√2", "8√2", "3√2"], "answer": "6√2", "solution": "√50=5√2; 2√8=4√2; √18=3√2 ⇒ 5√2+4√2−3√2=<b>6√2</b>."}, {"id": "m8q2", "type": "number", "prompt": "Calcula 81^(3/4).", "answer": 27, "solution": "81^(3/4)=(⁴√81)³=3³=<b>27</b>."}, {"id": "m8q3", "type": "mcq", "prompt": "Reduce √(a³) y ³√(a²) al menor índice común.", "options": ["⁶√(a⁹) y ⁶√(a⁴)", "⁵√(a⁶) y ⁵√(a⁴)", "⁶√(a⁶) y ⁶√(a⁶)", "¹²√(a¹⁸) y ¹²√(a⁸)"], "answer": "⁶√(a⁹) y ⁶√(a⁴)", "solution": "m.c.m.(2,3)=6. √(a³)=⁶√(a⁹); ³√(a²)=⁶√(a⁴)."}, {"id": "m8q4", "type": "number", "prompt": "Calcula √12·√3.", "answer": 6, "solution": "√12·√3=√36=<b>6</b>."}, {"id": "m8q5", "type": "mcq", "prompt": "Simplifica ³√16·³√4.", "options": ["4", "8", "2³√2", "4³√2"], "answer": "4", "solution": "³√16·³√4=³√64=<b>4</b>."}, {"id": "m8q6", "type": "mcq", "prompt": "Simplifica √(³√64)+√9.", "options": ["5", "6", "2√3", "11"], "answer": "5", "solution": "³√64=4; √4=2 y √9=3 ⇒ <b>5</b>."}, {"id": "m8q7", "type": "mcq", "prompt": "Simplifica 3√20−2√45.", "options": ["0", "6√5", "−3√5", "3√5"], "answer": "0", "solution": "3√20=6√5 y 2√45=6√5 ⇒ <b>0</b>."}, {"id": "m8q8", "type": "mcq", "prompt": "¿Cuál es la forma simplificada de ⁴√(x⁶) como potencia?", "options": ["x^(3/2)", "x^(2/3)", "x^(6/4)", "x^(4/6)"], "answer": "x^(3/2)", "solution": "⁴√(x⁶)=x^(6/4)=<b>x^(3/2)</b>."}]}],KEY="tribeca_radicales_3eso_v1",$=id=>document.getElementById(id);
let S={module:0,answers:{},checks:{},revealed:{},bestMixed:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.module=Math.max(0,Math.min(Number(S.module)||0,DATA.length-1));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function qs(){return DATA.flatMap(m=>m.questions)}function ok(q){const a=S.answers[q.id];if(q.type==="number"){if(a===undefined||a==="")return false;const n=Number(String(a).replace(",","."));return Number.isFinite(n)&&Math.abs(n-Number(q.answer))<1e-9}return a===q.answer}
function score(m){return m.questions.filter(ok).length}function global(){const all=qs(),n=all.filter(ok).length;$("pt").textContent=n+" de "+all.length+" ejercicios superados";$("bar").style.width=(n/all.length*100)+"%";$("mix").textContent="Repaso mixto: "+(S.bestMixed===null?"—":S.bestMixed+" / 8")}
function nav(){$("nav").innerHTML="";DATA.forEach((m,i)=>{const b=document.createElement("button");b.type="button";b.className=(i===S.module?"active ":"")+(score(m)===m.questions.length?"done":"");b.textContent=(i+1)+". "+m.title.replace(/^\d+\.\s*/,"");b.addEventListener("click",()=>{S.module=i;save();render()});$("nav").appendChild(b)})}
function render(){global();nav();const m=DATA[S.module],c=$("card");c.innerHTML='<h2>'+m.title+'</h2><div class="theory">'+m.theory+'</div><div class="example">'+m.example+'</div><div class="practice"><h3>Práctica</h3><span class="small">'+score(m)+' / '+m.questions.length+' superados</span></div><div id="host"></div><div class="footer"><button id="prev" class="btn secondary">Bloque anterior</button><button id="next" class="btn primary">'+(S.module===DATA.length-1?'Volver al inicio':'Bloque siguiente')+'</button></div>';
const h=$("host");m.questions.forEach((q,i)=>h.appendChild(qnode(q,i)));
$("prev").disabled=S.module===0;$("prev").addEventListener("click",()=>{if(S.module>0){S.module--;save();render();window.scrollTo(0,0)}});
$("next").addEventListener("click",()=>{S.module=S.module===DATA.length-1?0:S.module+1;save();render();window.scrollTo(0,0)})}
function qnode(q,i){const w=document.createElement("article");w.className="q";const p=document.createElement("div");p.className="qp";p.innerHTML=(i+1)+". "+q.prompt;w.appendChild(p);
if(q.type==="mcq"){const o=document.createElement("div");o.className="opts";q.options.forEach(x=>{const b=document.createElement("button");b.type="button";b.className="opt"+(S.answers[q.id]===x?" sel":"");b.innerHTML=x;b.addEventListener("click",()=>{S.answers[q.id]=x;S.checks[q.id]=false;S.revealed[q.id]=false;save();render()});o.appendChild(b)});w.appendChild(o)}else{const inp=document.createElement("input");inp.className="inp";inp.type="text";inp.inputMode="decimal";inp.placeholder="Resultado";if(S.answers[q.id]!==undefined)inp.value=S.answers[q.id];inp.addEventListener("input",()=>{S.answers[q.id]=inp.value.trim();S.checks[q.id]=false;S.revealed[q.id]=false;save();global()});w.appendChild(inp)}
const a=document.createElement("div");a.className="qa";const ch=document.createElement("button");ch.type="button";ch.className="btn primary";ch.textContent="Comprobar";ch.addEventListener("click",()=>{if(S.answers[q.id]===undefined||String(S.answers[q.id]).trim()==="")return;S.checks[q.id]=true;if(DATA[S.module].title.startsWith("8.")&&ok(q))S.bestMixed=Math.max(S.bestMixed||0,score(DATA[S.module]));save();render()});
const so=document.createElement("button");so.type="button";so.className="btn light";so.textContent=S.revealed[q.id]?"Ocultar solución":"Ver solución";so.addEventListener("click",()=>{S.revealed[q.id]=!S.revealed[q.id];save();render()});a.append(ch,so);w.appendChild(a);
if(S.checks[q.id]){const f=document.createElement("div");f.className="fb "+(ok(q)?"ok":"bad");f.textContent=ok(q)?"Correcto.":"Todavía no. Revisa y vuelve a intentarlo.";w.appendChild(f)}if(S.revealed[q.id]){const s=document.createElement("div");s.className="sol";s.innerHTML="<b>Desarrollo:</b> "+q.solution;w.appendChild(s)}return w}
render();
})();
</script></body></html>
