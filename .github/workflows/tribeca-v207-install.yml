name: Install Tribeca Aula v207

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tribeca-v207-install.yml'

permissions:
  contents: write

jobs:
  install-v207:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified v207 frontend patch
        shell: bash
        env:
          V207_PATCH_GZ_B64: ''
        run: |
          printf '%s' "$V207_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/v207.patch
          git apply --check /tmp/v207.patch
          git apply /tmp/v207.patch
          node --check supabase-auth.js
          node --check service-worker.js
          grep -q 'supabase-auth.js?v=207' index.html
          grep -q "tribeca-aula-static-v207" service-worker.js

      - name: Commit v207 and remove installer
        shell: bash
        run: |
          rm -f .github/workflows/tribeca-v207-install.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Tribeca Aula v207 (curso 2026/27)'
          git push origin HEAD:main
