name: Validate Tribeca v218
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v218.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          node --check app.js
          node --check supabase-auth.js
          node --check service-worker.js
          grep -q "teacher-dashboard-v217" supabase-auth.js
          grep -q "feliz cumple" supabase-auth.js
          grep -q "supabase-auth.js?v=218" index.html
          grep -q "tribeca-aula-static-v218" service-worker.js
          ! grep -q 'id="themeToggle"' index.html
      - run: |
          rm -f .github/workflows/validate-v218.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Validate Tribeca Aula v218" || true
          git push origin HEAD:main
