name: Validate Tribeca v220
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v220.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          node --check supabase-auth.js
          node --check service-worker.js
          grep -q "teacherSectionNavV219" supabase-auth.js
          grep -q "t16-teacher-tools" supabase-auth.js
          grep -q "Perfiles del alumnado','Editar nombre, apellidos, usuario, centro, etapa, curso, horario, NEE, NEAE y observaciones." supabase-auth.js
          ! grep -q "teacherDashboardGroupV217" supabase-auth.js
          ! grep -q "panel docente reorganizado" styles.css
          ! grep -q "\['classOverview'" supabase-auth.js
          grep -q "supabase-auth.js?v=220" index.html
          grep -q "styles.css?v=220" index.html
          grep -q "tribeca-aula-static-v220" service-worker.js
      - run: |
          rm -f .github/workflows/validate-v220.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Validate Tribeca Aula v220 teacher home" || true
          git push origin HEAD:main
