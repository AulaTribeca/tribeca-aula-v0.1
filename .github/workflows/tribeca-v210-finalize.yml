name: Tribeca management UI v210 finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tribeca-v210-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply CSS and version bumps
        shell: bash
        env:
          CSS_V210_B64: ''
        run: |
          if ! grep -q 'Tribeca Aula · v210 · gestión docente clara' styles.css; then
            printf '\n' >> styles.css
            printf '%s' "$CSS_V210_B64" | base64 -d >> styles.css
            printf '\n' >> styles.css
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'styles\.css\?v=\d+', 'styles.css?v=210', s)
          s=re.sub(r'supabase-auth\.js\?v=\d+', 'supabase-auth.js?v=210', s)
          s=s.replace('Curso 2025/26','Curso 2026/27')
          p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'Service worker v\d+', 'Service worker v210', s, count=1)
          s=re.sub(r'tribeca-aula-static-v\d+', 'tribeca-aula-static-v210', s, count=1)
          s=re.sub(r"\s*'\./assets/izam/tecnicas-estudio/unidad-1/gimnasio-1-pueblo-palabra/index\.html',?\s*", '\n', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate v210
        shell: bash
        run: |
          node --check supabase-auth.js
          node --check service-worker.js
          grep -q 'v210-money-summary' supabase-auth.js
          grep -q 'teacher-profiles-v210' supabase-auth.js
          grep -q 'attendance-v210' supabase-auth.js
          grep -q 'styles.css?v=210' index.html
          grep -q 'supabase-auth.js?v=210' index.html
          grep -q 'Curso 2026/27' index.html
          grep -q 'tribeca-aula-static-v210' service-worker.js
          ! grep -q 'assets/izam/tecnicas-estudio' service-worker.js
      - name: Commit final v210
        shell: bash
        run: |
          rm -f .github/workflows/tribeca-v210-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Tribeca Aula management UI v210'
          git push origin HEAD:main