# Tribeca Aula / auditoría de lectura.
# Repo PUBLIC: never print environment, page contents, screenshots, traces or sessions.
name: Tribeca Aula - pruebas de solo lectura

on:
  push:
    branches:
      - 'audit/playwright-readonly-*'
      - 'feat/cookie-consent-privacy-*'
      - main
  workflow_dispatch:
    inputs:
      alcance:
        description: 'Pruebas públicas o también perfiles de prueba'
        required: true
        default: publico
        type: choice
        options:
          - publico
          - completo

permissions:
  contents: read

concurrency:
  group: tribeca-playwright-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  public-smoke:
    name: Carga pública y accesibilidad (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (lectura)
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Dependencias de pruebas
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Motores de navegador público y ficticio
        run: npx playwright install --with-deps chromium webkit
      - name: Verificar sintaxis de escenarios y tests
        run: |
          node --check tests/fixtures/browser-classroom.mjs
          node --check tests/synthetic-classroom.spec.mjs
          node --check tests/roles-readonly.spec.mjs
          npx playwright test --list tests/synthetic-classroom.spec.mjs tests/roles-readonly.spec.mjs
      - name: Privacidad y cookies: rechazar, aceptar, revocar y menores (4 navegadores)
        if: startsWith(github.ref, 'refs/heads/feat/cookie-consent-privacy-')
        env:
          CI: 'true'
        run: |
          node --check tribeca-cookie-consent-v264.js
          node --check supabase-auth.js
          node --check tests/cookie-consent-v264.spec.mjs
          npx playwright test tests/cookie-consent-v264.spec.mjs --project=desktop-chromium --project=mobile-chromium --project=mobile-webkit --project=tablet-webkit
      - name: Capturas ficticias del aviso para aprobación
        if: always() && startsWith(github.ref, 'refs/heads/feat/cookie-consent-privacy-')
        uses: actions/upload-artifact@v4
        with:
          name: vista-previa-cookies-${{ github.run_id }}
          path: tests/cookie-preview/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Pruebas públicas
        env:
          CI: 'true'
        run: npx playwright test tests/public-smoke.spec.mjs --project=desktop-chromium --project=mobile-chromium
      - name: Lengua 2.º ESO, tema 2 - lectura real y compatibilidad
        if: github.ref == 'refs/heads/main'
        env:
          CI: 'true'
        run: |
          node --check tests/lengua-2eso-tema2.spec.mjs
          npx playwright test tests/lengua-2eso-tema2.spec.mjs --project=desktop-chromium --project=mobile-chromium --project=mobile-webkit --project=tablet-webkit
      - name: Verificar despliegue del nuevo publicador
        if: github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          const base='https://aulatribeca.github.io/tribeca-aula-v0.1/';
          let ready=false;
          for(let n=0;n<24;n++){
            try{
              const [index,resource]=await Promise.all([
                fetch(base+'?qa262='+n,{cache:'no-store'}).then(r=>r.text()),
                fetch(base+'recursos/lingua-galega-2eso-fernando-blanco-unidade-1-repaso-exame.html?qa='+n,{cache:'no-store'}).then(r=>r.text())
              ]);
              ready=index.includes('supabase-auth.js?v=262') &&
                index.includes('tribeca-publisher-v262.js?v=262') &&
                resource.includes('A lingua apréndese');
              if(ready)break;
            }catch(_e){}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('El recurso y el nuevo publicador todavía no están propagados.');
          console.log('Lingua Galega y publicador v262 disponibles.');
          NODE
      - name: Probar Galego y publicador en Chrome, Android, Safari iPhone y iPad
        if: github.ref == 'refs/heads/main'
        env:
          CI: 'true'
        run: |
          node --check supabase-auth.js
          node --check tribeca-publisher-v262.js
          node --check tests/lingua-galega-publisher-v262.spec.mjs
          npx playwright test tests/lingua-galega-publisher-v262.spec.mjs --project=desktop-chromium --project=mobile-chromium --project=mobile-webkit --project=tablet-webkit
      - name: Esperar recurso publicado v256 (solo main)
        if: github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          const root = 'https://aulatribeca.github.io/tribeca-aula-v0.1/';
          async function deployed() {
            const nonce = String(Date.now());
            const [index, bridge] = await Promise.all([
              fetch(root + '?audit=' + nonce, { cache: 'no-store' }).then(r => { if (!r.ok) throw Error('index unavailable'); return r.text(); }),
              fetch(root + 'resource-progress.js?v=256&ci=' + nonce, { cache: 'no-store' }).then(r => { if (!r.ok) throw Error('bridge unavailable'); return r.text(); })
            ]);
            return index.includes('resource-progress.js?v=256') &&
              bridge.includes("+'</script>'");
          }
          let ready = false;
          for (let attempt = 1; attempt <= 36; attempt++) {
            try { ready = await deployed(); } catch (_) { ready = false; }
            if (ready) { console.log('Versión v256 publicada y lista para pruebas de navegador.'); break; }
            if (attempt < 36) await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!ready) { console.log('No se ha propagado la versión v256 en GitHub Pages.'); process.exit(1); }
          NODE
      - name: Aula sintética sin acceso a la base de datos
        env:
          CI: 'true'
          TRIBECA_AUDIT_PREVIEW_FIX: ${{ startsWith(github.ref, 'refs/heads/audit/playwright-readonly-') && '1' || '0' }}
        run: npx playwright test tests/synthetic-classroom.spec.mjs --project=desktop-chromium --project=mobile-chromium --project=tablet-webkit

  roles-readonly:
    name: Perfiles de prueba (sin operaciones de escritura)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.alcance == 'completo'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      TRIBECA_AUDIT_STUDENT_USER: ${{ secrets.TRIBECA_AUDIT_STUDENT_USER }}
      TRIBECA_AUDIT_STUDENT_PASSWORD: ${{ secrets.TRIBECA_AUDIT_STUDENT_PASSWORD }}
      TRIBECA_AUDIT_TEACHER_USER: ${{ secrets.TRIBECA_AUDIT_TEACHER_USER }}
      TRIBECA_AUDIT_TEACHER_PASSWORD: ${{ secrets.TRIBECA_AUDIT_TEACHER_PASSWORD }}
    steps:
      - name: Verificar presencia de secretos (sin revelar valores)
        shell: bash
        run: |
          if [[ -z "$TRIBECA_AUDIT_STUDENT_USER" || -z "$TRIBECA_AUDIT_STUDENT_PASSWORD" || -z "$TRIBECA_AUDIT_TEACHER_USER" || -z "$TRIBECA_AUDIT_TEACHER_PASSWORD" ]]; then
            echo "::error::Faltan credenciales de prueba. Configura los cuatro secretos de GitHub Actions indicados en AUDITORIA_PLAYWRIGHT.md."
            exit 1
          fi
      - name: Checkout (lectura)
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Dependencias de pruebas
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Motores de navegador
        run: npx playwright install --with-deps chromium webkit
      - name: Verificar perfiles de prueba
        run: npx playwright test tests/roles-readonly.spec.mjs --project=desktop-chromium --project=mobile-chromium --project=tablet-webkit
